<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d5d">
<title>Nasza Kuchnia</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kuchnia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f7f4ef; --card:#ffffff; --ink:#23201c; --mut:#7d766c; --line:#e6e0d6;
  --acc:#2f7d5d; --acc-s:#e7f2ec; --her:#c2568b; --her-s:#fbeaf2; --him:#3a6ea5; --him-s:#e8f0f8;
  --warn:#b3651b; --warn-s:#fdf0e3; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{
  position:sticky;top:0;z-index:20;background:rgba(247,244,239,.93);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.hbar{display:flex;align-items:center;gap:10px;padding:12px 0 11px}
.hbar h1{font-size:19px;margin:0;flex:1;letter-spacing:-.3px}
.hbar .sub{font-size:12px;color:var(--mut);font-weight:400;display:block;letter-spacing:0}
.icobtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  font-size:17px;display:grid;place-items:center;cursor:pointer;flex:none}
.icobtn:active{transform:scale(.94)}
.icobtn.live{position:relative}
.icobtn.live:after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:#2f9e63;border:2px solid var(--card)}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav-in button{
  background:none;border:0;padding:9px 2px 10px;font:inherit;font-size:10.5px;color:var(--mut);
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav-in button .i{font-size:20px;line-height:1}
.nav-in button.on{color:var(--acc);font-weight:600}
section{display:none;padding:16px 0 24px;animation:in .18s ease}
section.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tight{padding:11px 13px}
h2{font-size:15px;margin:20px 0 9px;letter-spacing:-.2px}
h2:first-child{margin-top:0}
.muted{color:var(--mut);font-size:13px}
.tiny{font-size:11.5px;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
button.btn{
  background:var(--acc);color:#fff;border:0;border-radius:11px;padding:11px 15px;
  font:inherit;font-weight:600;font-size:14.5px;cursor:pointer}
button.btn:active{transform:scale(.98)}
button.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
button.btn.wide{width:100%}
button.btn:disabled{opacity:.45}
input,select,textarea{
  font:inherit;font-size:15px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;
  background:#fff;color:var(--ink);width:100%}
input:focus,select,textarea:focus{outline:2px solid var(--acc-s);border-color:var(--acc)}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:var(--acc-s);color:var(--acc)}
.pill.g{background:#eee9e0;color:var(--mut)}
.pill.w{background:var(--warn-s);color:var(--warn)}
.him{color:var(--him)} .her{color:var(--her)}
.chip-him{background:var(--him-s);color:var(--him)} .chip-her{background:var(--her-s);color:var(--her)}
/* --- plan --- */
.daytabs{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.daytabs button{flex:none;padding:8px 13px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);font:inherit;font-size:13.5px;cursor:pointer;text-align:center}
.daytabs button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.daytabs button b{display:block;font-size:11px;font-weight:500;opacity:.7}
.slot{border-bottom:1px solid var(--line);padding:11px 0}
.slot:last-child{border-bottom:0;padding-bottom:0}
.slot-h{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700;margin-bottom:6px}
.meal{display:flex;align-items:center;gap:10px}
.meal .nm{flex:1;font-size:14.5px;font-weight:600;line-height:1.25}
.meal .nm small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:#fff;flex:none;
  display:grid;place-items:center;cursor:pointer;color:#fff;font-size:15px;font-weight:800}
.chk.on{background:var(--acc);border-color:var(--acc)}
.emptyslot{color:var(--mut);font-size:14px;flex:1}
.trchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font:inherit;
  font-size:13px;font-weight:600;color:var(--mut);cursor:pointer}
.trchip.on.him{background:var(--him-s);border-color:var(--him);color:var(--him)}
.trchip.on.her{background:var(--her-s);border-color:var(--her);color:var(--her)}
.xmul{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 7px;font:inherit;
  font-size:12px;font-weight:700;color:var(--acc);cursor:pointer;flex:none}
/* --- lista zakupów --- */
.aisle{margin-bottom:6px}
.aisle-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;color:var(--mut);margin:16px 0 6px}
.aisle-h:before{content:"";height:1px;background:var(--line);flex:1;order:2}
.item{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .txt{flex:1;line-height:1.3}
.item .txt b{font-weight:600;font-size:14.5px}
.item.done .txt{text-decoration:line-through;opacity:.4}
.leftover{font-size:11.5px;color:var(--warn);margin-top:3px}
.leftover b{font-weight:700}
.sum{background:var(--acc-s);border:0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcol .pnm{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.pcol .pv{font-size:18px;font-weight:800;letter-spacing:-.5px}
.pcol .pv2{font-size:14px;font-weight:700;margin-top:7px}
.pcol small{font-size:11px;font-weight:500;color:var(--mut)}
.pbar{height:5px;border-radius:3px;background:#eee9e0;margin-top:4px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px}
.sum .big{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--acc)}
/* --- przepisy --- */
.rlist{display:flex;flex-direction:column;gap:9px}
.ritem{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 13px;cursor:pointer;text-align:left;font:inherit;width:100%}
.ritem:active{transform:scale(.995)}
.ritem .em{font-size:24px;flex:none}
.ritem .nm{flex:1}
.ritem .nm b{display:block;font-size:14.5px;font-weight:600}
.ritem .nm span{font-size:12px;color:var(--mut)}
.ing{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.ing:last-child{border-bottom:0}
.ing .q{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
ol.steps{margin:0;padding-left:20px}
ol.steps li{margin-bottom:7px;font-size:14.5px}
.macro{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--mut)}
.macro b{color:var(--ink);font-weight:700}
.plate{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.plate .p{border-radius:12px;padding:11px 12px}
.plate .p .who{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.75}
.plate .p .v{font-size:23px;font-weight:800;letter-spacing:-.8px;margin:2px 0 1px}
.plate .p .k{font-size:12px;opacity:.8}
.seg{display:flex;background:#efeae1;border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:13px;padding:7px 4px;border-radius:8px;cursor:pointer;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.07)}
/* --- modal --- */
.ov{position:fixed;inset:0;background:rgba(30,26,22,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:0 14px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.sheet-h{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet-h h3{margin:0;font-size:17px;flex:1;letter-spacing:-.3px}
.grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:8px auto -4px}
/* --- waga --- */
canvas{width:100%;height:230px;display:block}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.stat .s{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat .s .v{font-size:19px;font-weight:800;letter-spacing:-.5px}
.stat .s .l{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
table.log{width:100%;border-collapse:collapse;font-size:13.5px}
table.log th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:6px 4px;border-bottom:1px solid var(--line)}
table.log td{padding:7px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.note{background:var(--warn-s);border:1px solid #f0dcc4;border-radius:12px;padding:11px 12px;font-size:13px;color:#6b431a}
.note b{color:var(--warn)}
.ok{background:var(--acc-s);border:1px solid #cfe4d9;border-radius:12px;padding:11px 12px;font-size:13px;color:#1f5a42}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}
.empty .em{font-size:34px;display:block;margin-bottom:8px;opacity:.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));
  background:#23201c;color:#fff;padding:10px 16px;border-radius:11px;font-size:13.5px;z-index:60;
  opacity:0;pointer-events:none;transition:.2s;max-width:90%}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <div style="flex:1">
      <h1 id="hTitle">Plan na 3 dni</h1>
      <span class="sub" id="hSub">—</span>
    </div>
    <button class="icobtn" id="btnMsg" title="Napisz do Claude'a">💬</button>
    <button class="icobtn" id="btnSync" title="Para w sklepie">👫</button>
    <button class="icobtn" id="btnSet" title="Ustawienia">⚙️</button>
  </div>
</header>

<main class="wrap">
  <section id="s-plan" class="on"></section>
  <section id="s-shop"></section>
  <section id="s-rec"></section>
  <section id="s-fridge"></section>
  <section id="s-weight"></section>
</main>

<nav><div class="nav-in">
  <button data-t="plan" class="on"><span class="i">🗓️</span>Plan</button>
  <button data-t="shop"><span class="i">🛒</span>Zakupy</button>
  <button data-t="rec"><span class="i">📖</span>Przepisy</button>
  <button data-t="fridge"><span class="i">🧊</span>Lodówka</button>
  <button data-t="weight"><span class="i">⚖️</span>Waga</button>
</div></nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ==========================================================================
   NASZA KUCHNIA — prototyp
   Wszystko w jednym pliku. Dane zapisują się w pamięci telefonu.
   ========================================================================== */

/* --- 1. TRWAŁY ZAPIS (bezpieczny, nie wywala się gdy pamięć zablokowana) --- */
const mem = {};
/* DB.blad — czy ostatni zapis do pamięci telefonu się nie powiódł */
const DB = {
  get(k, d){
    if(DB.blad && (k in mem)) return mem[k];       // zapis padł: pamięć ulotna jest świeższa
    try{ const v = localStorage.getItem(k); return v==null ? (k in mem ? mem[k] : d) : JSON.parse(v); }
    catch(e){ return (k in mem) ? mem[k] : d; }
  },
  set(k, v){
    mem[k]=v;
    try{ localStorage.setItem(k, JSON.stringify(v)); DB.blad=false; }
    catch(e){
      /* pamięć pełna albo zablokowana — dane zostają tylko w pamięci ulotnej,
         więc użytkownik MUSI się o tym dowiedzieć zamiast stracić je po cichu */
      if(!DB.blad){ DB.blad=true;
        try{ toast('Nie mogę zapisać danych w telefonie — zwolnij miejsce, bo po zamknięciu apki przepadną'); }catch(_){}
      }
    }
  }
};

/* --- 2. ALEJKI W SKLEPIE (kolejność = kolejność chodzenia po sklepie) --- */
const AISLES = [
  ['warzywa','Warzywa i owoce','🥬'],
  ['pieczywo','Pieczywo','🥖'],
  ['nabial','Nabiał','🥛'],
  ['mieso','Mięso i ryby','🍗'],
  ['sypkie','Sypkie i konserwy','🥫'],
  ['mrozone','Mrożonki','🧊'],
  ['napoje','Napoje','🧃'],
  ['przyprawy','Suplementy i przyprawy','🧂'],
  ['chemia','Chemia i inne','🧴']
];

/* --- 3. PRODUKTY ---------------------------------------------------------
   u  : jednostka (g / ml / szt)
   kcal: na 100 g / 100 ml, a dla "szt" — za sztukę
   pack: wielkość opakowania w sklepie (null = kupujesz na wagę)
   gram: ile waży 1 sztuka (tylko dla u:'szt')                              */
const P = {
  serek:     {n:'Serek wiejski',        a:'nabial', u:'g',  kcal:98, b:11, t:4.3, w:3.4,  pack:200, o:1},
  twarog:    {n:'Twaróg półtłusty',     a:'nabial', u:'g',  kcal:133, b:18, t:4.7, w:3.5, pack:250, o:1},
  skyr:      {n:'Skyr naturalny',       a:'nabial', u:'g',  kcal:63, b:11, t:0.2, w:4,  pack:150, o:1},
  jogurt:    {n:'Jogurt grecki',        a:'nabial', u:'g',  kcal:97, b:6.4, t:5, w:4,  pack:400, o:1},
  mleko:     {n:'Mleko 2%',             a:'nabial', u:'ml', kcal:51, b:3.3, t:2, w:4.8,  pack:1000, o:1},
  serzolty:  {n:'Ser żółty',            a:'nabial', u:'g',  kcal:350, b:25, t:27, w:1, pack:150, o:1},
  maslo:     {n:'Masło',                a:'nabial', u:'g',  kcal:735, b:0.7, t:81, w:0.7, pack:200},
  feta:      {n:'Feta',                 a:'nabial', u:'g',  kcal:264, b:14, t:21, w:4, pack:200, o:1},
  jajko:     {n:'Jajka',                a:'nabial', u:'szt',kcal:70, b:6.5, t:4.8, w:0.4,  pack:10, gram:55, o:1},

  kurczak:   {n:'Pierś z kurczaka SUROWA', a:'mieso', u:'g', kcal:120, b:22.5, t:2.6, w:0, pack:null},
  kurczakG:  {n:'Pierś z kurczaka ugotowana/pieczona', a:'mieso', u:'g', kcal:165, b:31, t:3.6, w:0, pack:null},
  kurczakS:  {n:'Pierś z kurczaka smażona', a:'mieso', u:'g', kcal:180, b:31, t:6, w:0, pack:null},
  indyk:     {n:'Mielone z indyka',     a:'mieso',  u:'g',  kcal:150, b:20, t:8, w:0, pack:500, o:1},
  losos:     {n:'Łosoś (filet)',        a:'mieso',  u:'g',  kcal:200, b:20, t:13, w:0, pack:null},
  tunczyk:   {n:'Tuńczyk w wodzie',     a:'sypkie', u:'g',  kcal:100, b:23, t:1, w:0, pack:120, o:1},
  szynka:    {n:'Szynka drobiowa',      a:'mieso',  u:'g',  kcal:110, b:18, t:4, w:1, pack:100, o:1},

  passata:   {n:'Passata pomidorowa',   a:'sypkie', u:'g',  kcal:35, b:1.5, t:0.2, w:6,  pack:500, o:1},
  ryz:       {n:'Ryż biały (suchy)',    a:'sypkie', u:'g',  kcal:350, b:7, t:0.7, w:78, pack:1000},
  makaron:   {n:'Makaron pełnoziarnisty',a:'sypkie',u:'g',  kcal:350, b:12, t:2, w:68, pack:500},
  kasza:     {n:'Kasza gryczana',       a:'sypkie', u:'g',  kcal:336, b:13, t:3.4, w:65, pack:400},
  platki:    {n:'Płatki owsiane',       a:'sypkie', u:'g',  kcal:379, b:13, t:7, w:60, pack:500},
  maka:      {n:'Mąka pszenna',         a:'sypkie', u:'g',  kcal:364, b:10, t:1, w:76, pack:1000},
  ciecierzyca:{n:'Ciecierzyca z puszki',a:'sypkie', u:'g',  kcal:120, b:7, t:2, w:17, pack:240, o:1},
  oliwa:     {n:'Oliwa z oliwek',       a:'sypkie', u:'ml', kcal:884, b:0, t:100, w:0, pack:500},
  mo:        {n:'Masło orzechowe',      a:'sypkie', u:'g',  kcal:600, b:25, t:50, w:12, pack:350},
  miod:      {n:'Miód',                 a:'sypkie', u:'g',  kcal:320, b:0.3, t:0, w:80, pack:400},

  chleb:     {n:'Chleb żytni',          a:'pieczywo',u:'g', kcal:250, b:7, t:1.5, w:48, pack:500},
  tortilla:  {n:'Tortilla pełnoziarnista',a:'pieczywo',u:'szt',kcal:150, b:4, t:3.5, w:25,pack:8,gram:45, o:1},

  pomidor:   {n:'Pomidory',             a:'warzywa',u:'g',  kcal:18, b:0.9, t:0.2, w:3.5,  pack:null},
  papryka:   {n:'Papryka czerwona',     a:'warzywa',u:'g',  kcal:26, b:1, t:0.3, w:5,  pack:null},
  cebula:    {n:'Cebula',               a:'warzywa',u:'g',  kcal:40, b:1.1, t:0.1, w:8,  pack:null},
  czosnek:   {n:'Czosnek',              a:'warzywa',u:'g',  kcal:149, b:6, t:0.5, w:28, pack:null},
  cukinia:   {n:'Cukinia',              a:'warzywa',u:'g',  kcal:17, b:1.2, t:0.3, w:2,  pack:null},
  ogorek:    {n:'Ogórek',               a:'warzywa',u:'g',  kcal:15, b:0.7, t:0.1, w:2.5,  pack:null},
  szpinak:   {n:'Szpinak świeży',       a:'warzywa',u:'g',  kcal:23, b:2.9, t:0.4, w:1.5,  pack:150, o:1},
  salata:    {n:'Sałata / mix',         a:'warzywa',u:'g',  kcal:15, b:1.4, t:0.2, w:1.5,  pack:150, o:1},
  pieczarki: {n:'Pieczarki',            a:'warzywa',u:'g',  kcal:22, b:3.1, t:0.3, w:1,  pack:250, o:1},

/* Jednorazowe przeniesienie starych wpisów (klucze "0-obiad") na daty.
   Bez tego plan przesuwałby się o dzień po każdej północy. */
function migracjaNaDaty(){
  if(DB.get('migracjaDat', false)) return;
  const nowyPlan = {}, nowyTrain = {};
  Object.entries(PLAN).forEach(([k,v])=>{
    const m = k.match(/^(\d+)-(.+)$/);
    nowyPlan[m ? dayKey(+m[1])+'|'+m[2] : k] = v;
  });
  Object.entries(TRAIN).forEach(([k,v])=>{
    nowyTrain[/^\d+$/.test(k) ? dayKey(+k) : k] = v;
  });
  PLAN = nowyPlan; TRAIN = nowyTrain;
  DB.set('plan',PLAN); DB.set('train',TRAIN); DB.set('migracjaDat', true);
}

/* Sprzątanie: dania i treningi z dni, które już minęły, znikają z planu
   (i przestają zawyżać listę zakupów). */
function sprzatnijPrzeszlosc(){
  const dzis = iso(new Date());
  let zmiana = false;
  Object.keys(PLAN).forEach(k=>{ const d = k.split('|')[0];
    if(/^\d{4}-\d{2}-\d{2}$/.test(d) && d < dzis){ delete PLAN[k]; zmiana = true; } });
  Object.keys(TRAIN).forEach(k=>{
    if(/^\d{4}-\d{2}-\d{2}$/.test(k) && k < dzis){ delete TRAIN[k]; zmiana = true; } });
  if(RECDEL.length > 300){ RECDEL = RECDEL.slice(-300); DB.set('recdel',RECDEL); }
  if(MSGDEL.length > 300){ MSGDEL = MSGDEL.slice(-300); DB.set('msgdel',MSGDEL); }
  Object.keys(BTS).forEach(p=>{ if(!P[p]) delete BTS[p]; });
  DB.set('bts', BTS);
  const granica = iso(new Date(Date.now() - 60*864e5));
  Object.keys(EATEN).forEach(k=>{ if(k < granica){ delete EATEN[k]; zmiana = true; } });
  if(zmiana){ DB.set('plan',PLAN); DB.set('train',TRAIN); DB.set('eaten',EATEN); }
}

/* ---------- zapotrzebowanie kaloryczne ----------
   Wzór Mifflina-St Jeora — standard w dietetyce, ale to zawsze szacunek
   populacyjny. Prawdę weryfikuje waga po dwóch tygodniach, nie kalkulator. */
function bmrCalc(sex, kg, cm, age){
  if(!kg || !cm || !age) return 0;
  return sex==='M' ? 10*kg + 6.25*cm - 5*age + 5 : 10*kg + 6.25*cm - 5*age - 161;
}
/* aktualna waga: średnia z 7 dni, a jak brak — ostatni pomiar */
function wagaAkt(who){
  const rows = weightRows(), k = who==='him' ? 'him' : 'her';
  const zPomiarem = rows.filter(r=>typeof r[k]==='number');
  if(!zPomiarem.length) return 0;
  /* średnia z 7 dni licząc od OSTATNIEGO pomiaru, a nie z siedmiu dowolnie
     odległych wpisów */
  const koniec = new Date(zPomiarem[zPomiarem.length-1].d).getTime();
  const s = zPomiarem.filter(r=>{ const t=new Date(r.d).getTime();
    return t > koniec - 7*864e5 && t <= koniec; }).map(r=>r[k]);
  return s.reduce((a,b)=>a+b,0)/s.length;
}
function profil(who){
  const P_ = who==='him'
    ? {sex:S.himSex, age:S.himAge, h:S.himH, pal:S.himPal, def:S.himDef, min:Math.max(1500, S.himMin||0)}
    : {sex:S.herSex, age:S.herAge, h:S.herH, pal:S.herPal, def:S.herDef, min:Math.max(1200, S.herMin||0)};
  P_.kg = wagaAkt(who);
  return P_;
}
function policzCele(who){
  const p = profil(who);
  const b = bmrCalc(p.sex, p.kg, p.h, p.age);
  if(!b) return null;
  const tdee = b * p.pal;
  const cel  = tdee - p.def;
  const dol  = Math.max(Math.round(b), p.min);        // niżej nie schodzimy
  return {kg:p.kg, bmr:r0(b), tdee:r0(tdee), cel:r0(cel), dol, zaNisko: cel < dol,
          bialko: r0(p.kg * 1.9)};
}
/* cel na konkretny dzień — trening dokłada 10% */
/* 0 = brak, 1 = jeden trening, 2 = dwa tego samego dnia */
function poziomTreningu(day, who){
  const v = TRAIN[day] && TRAIN[day][who==='him'?'h':'r'];
  return v === true ? 1 : (+v || 0);
}
const trenuje = (day, who) => poziomTreningu(day, who) > 0;
function celDnia(who, day){
  const baza = who==='him' ? S.himKcal : S.herKcal;
  const lvl = poziomTreningu(day, who);
  const proc = lvl === 2 ? (S.trainBoost2||20) : lvl === 1 ? (S.trainBoost||15) : 0;
  return r0(baza * (1 + proc/100));
}

/* ---------- rozpoznawanie składników z tekstu ----------
   Zamienia "200 g kurczaka, 2 jajka, łyżka oliwy" na policzone pozycje.
   Działa bez internetu, na Waszej bazie produktów. */
const MIARY = {
  'g':1,'gram':1,'gramy':1,'gramów':1,'dag':10,'deka':10,'kg':1000,
  'ml':1,'l':1000,'litr':1000,
  'szt':null,'sztuki':null,'sztuk':null,'sztuka':null,
  'łyżka':15,'łyżki':15,'łyżek':15,'lyzka':15,
  'łyżeczka':5,'łyżeczki':5,'lyzeczka':5,
  'szklanka':250,'szklanki':250,'garść':30,'garsc':30,'plaster':20,'plasterek':20,
  'opakowanie':null,'opak':null,'paczka':null,'paczki':null,'kostka':null
};
const MIARY_N = {};   // te same miary, ale bez polskich znaków
const bezOgonkow = t => String(t).toLowerCase()
  .replace(/ą/g,'a').replace(/ć/g,'c').replace(/ę/g,'e').replace(/ł/g,'l').replace(/ń/g,'n')
  .replace(/ó/g,'o').replace(/ś/g,'s').replace(/ż/g,'z').replace(/ź/g,'z');

Object.keys(MIARY).forEach(k=>{ MIARY_N[bezOgonkow(k)] = MIARY[k]; });

/* Najczęstsze słowa mają jednoznacznego faworyta — „kurczak” to pierś, a nie
   skrzydełka, bo tak ludzie mówią, gdy nie precyzują. */
const ALIASY = {kurczak:'kurczak', mleko:'mleko', twarog:'twarogChudy', ryz:'ryz',
  makaron:'makaron', chleb:'chleb', jajko:'jajko', jajka:'jajko', oliwa:'oliwa',
  maslo:'maslo', jogurt:'jogurt', platki:'platki', kasza:'kasza', banan:'banan',
  ziemniaki:'ziemniak', cebula:'cebula', pomidor:'pomidor', ogorek:'ogorek'};

function znajdzProdukt(fraza){
  const f = bezOgonkow(fraza).replace(/[^a-z0-9 ]/g,' ').trim();
  if(f.length < 3) return null;
  const slowaZap = f.split(' ').filter(w=>w.length >= 3 || /[0-9]/.test(w));
  if(!slowaZap.length) return null;

  /* Liczy się nie tylko to, czy słowo pasuje, ale ILE nazwy produktu zostało
     pokryte. Bez tego „migdały” trafiały w „Napój migdałowy niesłodzony”,
     bo jedno pasujące słowo wystarczało — a to błąd czterdziestokrotny. */
  const podobne = (a,b) => {
    if(a === b) return 1;
    const max = Math.min(a.length, b.length);
    let i = 0; while(i < max && a[i] === b[i]) i++;
    if(i >= 5) return 1;                                   // „orzechowe” ~ „orzechowego”
    if(i >= 4) return 0.75;                                // „maslo” ~ „masla”, „chudy” ~ „chudego”
    if(i >= 3 && (i === a.length || i === b.length)) return 0.6;   // „ryz” ~ „ryzu”
    return 0;
  };

  let best = null, bestScore = 0, bestDl = 999;
  Object.keys(P).forEach(pid=>{
    const slowaProd = bezOgonkow(P[pid].n).replace(/[^a-z0-9 ]/g,' ').split(' ')
                        .filter(w=>w.length >= 3 || /[0-9]/.test(w));
    if(!slowaProd.length) return;
    let trafioneProd = 0, jakosc = 0;
    slowaProd.forEach(sp=>{
      let naj = 0;
      slowaZap.forEach(sz=>{ naj = Math.max(naj, podobne(sp, sz)); });
      if(naj > 0){ trafioneProd++; jakosc += naj; }
    });
    if(!trafioneProd) return;
    let trafioneZap = 0;
    slowaZap.forEach(sz=>{
      let naj = 0; slowaProd.forEach(sp=>{ naj = Math.max(naj, podobne(sp, sz)); });
      if(naj > 0) trafioneZap++;
    });
    const pokrycieProd = trafioneProd / slowaProd.length;
    const pokrycieZap  = trafioneZap / slowaZap.length;
    let score = (jakosc / trafioneProd) * (0.65*pokrycieProd + 0.35*pokrycieZap);
    slowaZap.forEach(sz=>{ Object.keys(ALIASY).forEach(al=>{
      if(ALIASY[al] === pid && podobne(al, sz) >= 0.75) score += 0.2; }); });
    /* przy remisie wygrywa nazwa krótsza, czyli bardziej ogólna */
    if(score > bestScore + 0.001 || (Math.abs(score - bestScore) <= 0.001 && slowaProd.length < bestDl)){
      bestScore = score; best = pid; bestDl = slowaProd.length;
    }
  });
  return bestScore >= 0.45 ? best : null;
}

function parsujJedzenie(txt){
  const wynik = [];
  String(txt||'').split(/[,;\n]+|\si\s/).map(x=>x.trim()).filter(Boolean).forEach(kawalek=>{
    const m = kawalek.match(/^\s*([0-9]+(?:[.,][0-9]+)?)?\s*([a-ząćęłńóśżź]+)?\s*(.*)$/i);
    if(!m) return;
    let ile = m[1] ? parseFloat(m[1].replace(',','.')) : null;
    let miara = m[2] ? bezOgonkow(m[2]) : '';
    let nazwa = m[3] || '';
    /* "2 jajka" — brak miary, liczba dotyczy sztuk */
    if(!(miara in MIARY_N)){ nazwa = (m[2] ? m[2]+' ' : '') + nazwa; miara = ''; }
    /* „30 g białka” w Waszym języku znaczy 30 g PROSZKU odżywki, a nie
       30 g białka jako makroskładnika — to kolokwializm, nie pomyłka */
    const nOk = bezOgonkow(nazwa || kawalek);
    let pid;
    if(/\bbialk/.test(nOk) && !/jaj|serek|twarog|ser\b/.test(nOk)) pid = 'odzywka';
    else pid = znajdzProdukt(nazwa || kawalek);
    if(!pid){ wynik.push({nazwa: kawalek, brak:true}); return; }
    const p = P[pid];
    let q;
    /* „opakowanie serka” = cała paczka z etykiety */
    if(['opakowanie','opak','paczka','paczki','kostka'].indexOf(miara) >= 0 && p.pack) q = (ile || 1) * p.pack;
    else if(p.u === 'szt') q = ile || 1;
    else if(miara && MIARY_N[miara]) q = (ile || 1) * MIARY_N[miara];
    else if(ile && ile > 20) q = ile;                 // "200 kurczaka" = gramy
    else q = (ile || 1) * (p.gram || 100);            // "1 banan" ≈ jedna sztuka
    const t = recipeTotals({ing:[[pid, q]]});
    wynik.push({pid, q, nazwa: p.n, kcal:t.kcal, b:t.b, tl:t.t, we:t.w});
  });
  return wynik;
}

/* ---------- co faktycznie zjedzone ---------- */
function dziennik(dk){
  EATEN[dk] = EATEN[dk] || {};
  ['him','her'].forEach(w=>{ EATEN[dk][w] = EATEN[dk][w] || {slots:{}, extra:[]}; });
  return EATEN[dk];
}
function zjedzone(dk, who){
  const dz = dziennik(dk)[who];
  let kcal = 0, b = 0;
  SLOTS.forEach(([sk])=>{
    const zapis = dz.slots[sk];
    if(!zapis) return;
    /* przy odhaczeniu zapamiętujemy wyliczone wartości — dzięki temu skasowanie
       przepisu nie zeruje wstecz tego, co ktoś faktycznie zjadł */
    if(typeof zapis === 'object' && zapis.kcal != null){ kcal += zapis.kcal; b += zapis.b||0; return; }
    const e = PLAN[dk+'|'+sk]; if(!e) return;
    const rec = recById2(e.r); if(!rec) return;
    const t = recipeTotals(rec, 1);
    const udzial = who==='him' ? shareDnia(dk) : 1-shareDnia(dk);
    kcal += t.kcal*udzial; b += t.b*udzial;
  });
  (dz.extra||[]).forEach(x=>{ kcal += (+x.k||0); b += (+x.b||0); });
  return {kcal:r0(kcal), b:r0(b), cokolwiek: Object.values(dz.slots).some(Boolean) || (dz.extra||[]).length>0};
}
const shareDnia = dk => {
  const h = celDnia('him', dk), r = celDnia('her', dk);
  return (h+r) ? h/(h+r) : 0.5;
};

/* udział On / Ona w każdym daniu, liczony z celów kalorycznych */
const shareHim = () => {
  const h = celDnia('him', dayKey(dayIdx)), r = celDnia('her', dayKey(dayIdx));
  return (h+r) ? h/(h+r) : 0.5;
};

/* ile waży i ile ma kalorii całe danie (na dwoje) */
function recipeTotals(rec, mul=1){
  let g=0, kcal=0, b=0, t=0, w=0;
  rec.ing.forEach(([pid,q])=>{
    const p = P[pid]; if(!p) return;
    const Q = q*mul;
    const f = p.u==='szt' ? Q : Q/100;      // ile "porcji tabelowych" produktu
    g    += p.u==='szt' ? Q*(p.gram||0) : Q;
    kcal += f*(p.kcal||0);
    b    += f*(p.b||0); t += f*(p.t||0); w += f*(p.w||0);
  });
  return {g:r0(g), kcal:r0(kcal), b:r0(b), t:r0(t), w:r0(w)};
}
const recById = id => R.find(x=>x.id===id);
function fmtQ(pid, q){
  const p = P[pid];
  if(p.u==='szt') return r1(q) + ' ' + (q===1?'szt':'szt');
  if(q>=1000) return r1(q/1000) + (p.u==='ml'?' l':' kg');
  return r0(q) + ' ' + p.u;
}

/* ==========================================================================
   EKRAN 2 — LISTA ZAKUPÓW
   ========================================================================== */
function buildList(){
  const need = {}, from = {};
  const okno = {};
  for(let i=0;i<S.days;i++) okno[dayKey(i)] = 1;
  Object.entries(PLAN).forEach(([k,e])=>{
    if(!e || e.on===false) return;
    if(!okno[k.split('|')[0]]) return;          // dni spoza okna nie idą na zakupy
    const rec = recById2(e.r); if(!rec) return;
    rec.ing.forEach(([pid,q])=>{
      if(!P[pid]) return;
      need[pid] = (need[pid]||0) + q*(e.mul||1);
      (from[pid] = from[pid]||[]).push(rec.n);
    });
  });
  return {need, from};
}

function renderShop(){
  const {need, from} = buildList();
  const wszystkie = Object.keys(need);
  /* to, co mamy w domu, odejmujemy od potrzebnej ilości */
  const doKupienia = {}, wDomu = [];
  wszystkie.forEach(pid=>{
    const zapas = PANTRY[pid] || 0;
    const brak = need[pid] - zapas;
    if(brak > 0.001) doKupienia[pid] = brak; else wDomu.push(pid);
  });
  const ids = Object.keys(doKupienia);
  const d = [];

  if(!wszystkie.length){
    $('#s-shop').innerHTML = '<div class="empty"><span class="em">🛒</span>Nic jeszcze nie zaznaczone.<br>Wejdź w Plan i zaznacz ptaszkami dania.</div>';
    return;
  }
  if(!ids.length){
    $('#s-shop').innerHTML = '<div class="ok" style="margin-bottom:12px"><b>Nic nie musicie kupować.</b><br>Wszystko na te dni macie już w spiżarni.</div>'
      + '<div class="card"><div class="tiny">' + wDomu.map(p=>esc(P[p].n)).join(' • ') + '</div></div>';
    return;
  }

  const doneCnt = ids.filter(i=>BOUGHT[i]).length;
  d.push('<div class="card sum between"><div>');
  d.push(`<div class="tiny" style="color:#1f5a42">Lista na ${S.days} dni</div><div class="big">${doneCnt}/${ids.length}</div>`);
  d.push('</div><button class="btn ghost sm" data-clear="1">Wyczyść ptaszki</button></div>');

  /* ostrzeżenia o otwartych resztkach */
  const warns = [];
  ids.forEach(pid=>{
    const p = P[pid]; if(!p.pack || !p.o) return;
    const packs = Math.ceil(doKupienia[pid]/p.pack), rest = packs*p.pack - doKupienia[pid];
    if(rest >= p.pack*0.34){
      const alt = ALL().filter(r => r.ing.some(([x])=>x===pid) && !from[pid].includes(r.n));
      warns.push({pid, rest, alt: alt[0]});
    }
  });
  if(warns.length){
    d.push('<div class="note" style="margin-bottom:12px"><b>Zostaną otwarte resztki:</b><br>');
    warns.slice(0,4).forEach(w=>{
      d.push(`• ${esc(P[w.pid].n)} — zostanie ${fmtQ(w.pid,w.rest)}`);
      if(w.alt) d.push(` → zużyjecie to w: <b>${esc(w.alt.n)}</b>`);
      d.push('<br>');
    });
    if(warns.length>4) d.push(`<span class="tiny">…i jeszcze ${warns.length-4} drobiazgów</span>`);
    d.push('</div>');
  }

  AISLES.forEach(([ak,an,ae])=>{
    const inA = ids.filter(i=>P[i].a===ak).sort((a,b)=>P[a].n.localeCompare(P[b].n,'pl'));
    if(!inA.length) return;
    d.push(`<div class="aisle-h"><span>${ae} ${an}</span></div><div class="card">`);
    inA.forEach(pid=>{
      const p = P[pid], q = doKupienia[pid];
      let packInfo = '';
      if(p.pack){
        const packs = Math.ceil(q/p.pack), rest = packs*p.pack - q;
        packInfo = `<div class="tiny">${packs} × opakowanie ${fmtQ(pid,p.pack)}` + (rest>0 ? ` <span style="color:var(--warn)">• zostanie ${fmtQ(pid,rest)}</span>` : ' <span style="color:var(--acc)">• równo</span>') + '</div>';
      }
      d.push(`<div class="item ${BOUGHT[pid]?'done':''}" data-buy="${esc(pid)}">
        <button class="chk ${BOUGHT[pid]?'on':''}">✓</button>
        <div class="txt"><b>${esc(p.n)} — ${fmtQ(pid,q)}</b>${packInfo}
        <div class="tiny" style="opacity:.75">${esc([...new Set(from[pid])].join(' + '))}</div></div>
        <button class="xmul" data-mam="${esc(pid)}" title="mam w domu">🥫</button></div>`);
    });
    d.push('</div>');
  });

  if(wDomu.length){
    d.push('<div class="aisle-h"><span>🥫 Macie w domu — nie kupujecie</span></div><div class="card">');
    wDomu.forEach(pid=>{
      d.push(`<div class="item"><div class="txt"><b style="font-weight:500">${esc(P[pid].n)}</b>
        <div class="tiny">potrzeba ${fmtQ(pid,need[pid])}, w spiżarni ${fmtQ(pid,PANTRY[pid]||0)}</div></div></div>`);
    });
    d.push('</div>');
  }
  d.push('<button class="btn ghost wide" data-share="1" style="margin-top:6px">📤 Wyślij listę (SMS / WhatsApp)</button>');
  $('#s-shop').innerHTML = d.join('');
}

function weightRows(){
  return Object.entries(WEIGHT).map(([d,v])=>Object.assign({d}, v)).sort((a,b)=>a.d<b.d?-1:1);
}
/* Średnia z ostatnich 7 DNI KALENDARZOWYCH. Wcześniej liczona z 7 ostatnich
   wpisów — przy ważeniu raz w tygodniu brała pomiary sprzed półtora miesiąca. */
function movAvg(rows, key, win=7){
  return rows.map((r,i)=>{
    const koniec = new Date(r.d).getTime(), start = koniec - (win-1)*864e5;
    const s = rows.slice(0, i+1)
      .filter(x=>{ const t = new Date(x.d).getTime(); return t>=start && t<=koniec; })
      .map(x=>x[key]).filter(v=>typeof v==='number');
    return s.length ? s.reduce((a,b)=>a+b,0)/s.length : null;
  });
}
/* Czy średnia z 7 dni stoi w miejscu względem tygodnia wstecz?
   Zwraca zmianę w kg albo null, gdy za mało pomiarów. */
function zastoj(){
  const rows = weightRows();
  /* okna liczone po DATACH, nie po liczbie wpisów, i nigdy zachodzące na siebie —
     wcześniej przy 5-6 pomiarach apka ogłaszała zastój przy prawidłowym spadku */
  const dzis = new Date();
  const sr = (k, offDni) => {
    const od = iso(new Date(dzis.getTime() - (offDni+7)*864e5));
    const doo = iso(new Date(dzis.getTime() - offDni*864e5));
    const wyc = rows.filter(r=>r.d > od && r.d <= doo)
                    .map(r=>r[k]).filter(v=>typeof v==='number');
    return wyc.length>=3 ? wyc.reduce((a,b)=>a+b,0)/wyc.length : null;
  };
  const out = {};
  ['him','her'].forEach(k=>{
    const ter = sr(k,0), tydzTemu = sr(k,7);
    out[k] = (ter!=null && tydzTemu!=null) ? ter - tydzTemu : null;
  });
  return out;
}
function pytacOZastoj(){
  if(!S.lastAsk) return true;
  return (Date.now() - new Date(S.lastAsk).getTime()) > 6*864e5;
}

    d.push('</div>');

    d.push('</div></div>');
  }

  d.push('<div class="note">Waga z dnia na dzień skacze o 1–2 kg przez wodę, sól, treść jelitową i cykl. <b>Patrzcie tylko na linię średniej</b> — jeśli ona idzie w dół, redukcja działa, nawet gdy dzisiejszy pomiar jest wyższy.</div>');

  if(rows.length){
    d.push('<h2>Historia</h2><div class="card"><table class="log"><tr><th>Data</th><th>'+esc(S.himName)+'</th><th>'+esc(S.herName)+'</th><th>Pas</th></tr>');
    rows.slice().reverse().slice(0,20).forEach(r=>{
      d.push(`<tr><td>${r.d.slice(5).split('-').reverse().join('.')}</td><td>${esc(r.him??'—')}</td><td>${esc(r.her??'—')}</td><td class="tiny">${esc(r.waistHim??'—')} / ${esc(r.waistHer??'—')}</td></tr>`);
    });
    d.push('</table></div>');
    d.push('<button class="btn ghost wide" data-demo="1" style="margin-top:4px">Wgraj przykładowe dane (do obejrzenia wykresu)</button>');
  } else {
    d.push('<button class="btn ghost wide" data-demo="1">Wgraj przykładowe dane (do obejrzenia wykresu)</button>');
  }

  $('#s-weight').innerHTML = d.join('');
  if(rows.length>=2) drawChart(rows);
}

function drawChart(rows){
  const cv = $('#cv'); if(!cv) return;
  const dpr = window.devicePixelRatio||1, W = cv.clientWidth, H = 230;
  cv.width = W*dpr; cv.height = H*dpr;
  const x = cv.getContext('2d'); x.scale(dpr,dpr); x.clearRect(0,0,W,H);
  /* dwa osobne panele — każdy ma własną skalę, żeby było widać ruch */
  const L=34, Rr=8, gap=14, ph=(H-gap)/2;
  const panels = [
    {k:'him', c:'#3a6ea5', nm:S.himName, top:2},
    {k:'her', c:'#c2568b', nm:S.herName, top:2+ph+gap}
  ];
  const px = i => L + (W-L-Rr) * (rows.length<2 ? 0.5 : i/(rows.length-1));
  x.font='10px sans-serif'; x.lineWidth=1;
  panels.forEach(pn=>{
    const vals = rows.map(r=>r[pn.k]).filter(v=>typeof v==='number');
    if(vals.length<2) return;
    let mn=Math.min(...vals), mx=Math.max(...vals);
    const pv=Math.max(0.4,(mx-mn)*0.22); mn-=pv; mx+=pv;
    const t=pn.top+14, h=ph-18;
    const py = v => t + h*(1-(v-mn)/(mx-mn));
    x.strokeStyle='#eee9e0';
    [0,.5,1].forEach(f=>{ const y=t+h*f; x.beginPath(); x.moveTo(L,y); x.lineTo(W-Rr,y); x.stroke(); });
    x.fillStyle='#a39b8f';
    x.fillText(r1(mx),2,t+4); x.fillText(r1(mn),2,t+h+4);
    x.fillStyle=pn.c; x.font='bold 10px sans-serif';
    x.fillText(pn.nm.toUpperCase(), L, pn.top+9);
    x.font='10px sans-serif';
    x.fillStyle = pn.c+'4d';
    rows.forEach((r,i)=>{ if(typeof r[pn.k]!=='number') return; x.beginPath(); x.arc(px(i),py(r[pn.k]),2.6,0,7); x.fill(); });
    x.strokeStyle=pn.c; x.lineWidth=2.4; x.beginPath(); let st=false;
    movAvg(rows,pn.k).forEach((v,i)=>{ if(v==null) return; const X=px(i),Y=py(v); st?x.lineTo(X,Y):x.moveTo(X,Y); st=true; });
    x.stroke();
  });
}

/* --- przepis --- */
let sheetMul = 1, sheetKey = null;
function openRecipe(id, key){
  const rec = recById2(id); if(!rec) return;
  sheetKey = key || null;
  sheetMul = (key && PLAN[key] && PLAN[key].mul) || 1;
  drawRecipe(rec);
}
function drawRecipe(rec){
  const mul = sheetMul, t = recipeTotals(rec, mul), sh = shareHim();
  const gHim = r0(t.g*sh), gHer = t.g-gHim, kHim = r0(t.kcal*sh), kHer = t.kcal-kHim;
  const d = [];
  d.push(`<div class="sheet-h"><h3>${esc(rec.em||'🍽️')} ${esc(rec.n)}</h3><button class="icobtn" data-close="1">✕</button></div>`);

  /* batch cooking */
  d.push('<div class="card tight"><div class="between"><b style="font-size:13.5px">🍲 Gotuję na</b><div class="seg" style="margin:0;flex:1;max-width:230px">');
  [1,2,3].forEach(m=>d.push(`<button data-setmul="${m}" class="${mul===m?'on':''}">${m} ${m===1?'dzień':'dni'}</button>`));
  d.push('</div></div>');
  if(mul>1){
    const portions = 2*mul, per = r0(t.g/portions);
    const cont = Math.max(1, Math.ceil(per/S.containerMl));
    d.push(`<div class="tiny" style="margin-top:9px">Wyjdzie <b>${portions} porcji</b> po ok. ${per} g. Potrzebujecie <b>${portions*cont} pojemników</b> po ${S.containerMl} ml.</div>`);
  }
  d.push('</div>');

  /* składniki */
  d.push('<h2>1. Składniki — wrzuć do jednej miski</h2><div class="card">');
  rec.ing.forEach(([pid,q])=>{
    const p = P[pid]; if(!p) return;
    const Q = q*mul;
    let extra = '';
    if(p.pack && p.u!=='szt'){ const packs = Q/p.pack; if(Math.abs(packs-Math.round(packs))<0.02) extra = ` <span class="tiny">(${Math.round(packs)} opak.)</span>`; }
    d.push(`<div class="ing"><span>${esc(p.n)}${extra}</span><span class="q">${fmtQ(pid,Q)}</span></div>`);
  });
  d.push(`<div class="ing" style="border-top:2px solid var(--line);margin-top:4px;padding-top:8px"><span><b>Razem</b></span><span class="q">${t.g} g • ${t.kcal} kcal</span></div>`);
  d.push(`<div class="macro"><span><b>${t.b} g</b> białka</span><span><b>${t.t} g</b> tłuszczu</span><span><b>${t.w} g</b> węgli</span></div>`);

/* ==========================================================================
   AUTOMATYCZNE UKŁADANIE PLANU
   Losuje setki wariantów i wybiera ten, który najlepiej trafia w cele
   kaloryczne i białkowe, nie powtarza dań i najlepiej zużywa opakowania.
   ========================================================================== */
let autoOpt = {batch:true, quick:false};

function pool(slot){
  let p = ALL().filter(r=>(r.typ||[]).includes(slot));
  if(autoOpt.quick) { const f = p.filter(r=>(r.t||15)<=25); if(f.length) p = f; }
  return p.length ? p : ALL();
}
const rnd = a => a[Math.floor(Math.random()*a.length)];

function planScore(days){
  const bTarget = S.himProt + S.herProt;
  let score = 0; const used = {}; const counts = {};
  days.forEach((day, di)=>{
    /* cel dnia z uwzględnieniem treningów — bez tego zaznaczenie treningu
       podnosiło poprzeczkę, ale miska zostawała tej samej wielkości */
    const kTarget = celDnia('him', dayKey(di)) + celDnia('her', dayKey(di));
    let k=0, b=0;
    Object.values(day).forEach(rec=>{
      if(!rec) return;
      const t = recipeTotals(rec,1); k += t.kcal; b += t.b;
      counts[rec.id] = (counts[rec.id]||0)+1;
      rec.ing.forEach(([pid])=>{ used[pid] = (used[pid]||0)+1; });
    });
    score += Math.abs(k - kTarget);                       // odchyłka kaloryczna
    score += Math.max(0, bTarget - b) * 6;                // brak białka boli mocno
    score += Math.max(0, b - bTarget*1.4) * 1;            // absurdalny nadmiar też
  });
  Object.values(counts).forEach(c=>{ if(c>2) score += (c-2)*400; });   // za dużo powtórek
  const shared = Object.values(used).filter(c=>c>1).length;
  score -= shared * 25;                                   // premia za wspólne opakowania
  return score;
}

function buildCandidate(n){
  const days = [];
  /* obiady: bloki po 2 dni przy gotowaniu na zapas */
  const ob = pool('obiad').slice(), blocks = [];
  for(let d=0; d<n; ){
    const len = autoOpt.batch ? Math.min(2, n-d) : 1;
    let r;
    if(ob.length){ const i = Math.floor(Math.random()*ob.length); r = ob.splice(i,1)[0]; }
    else r = rnd(pool('obiad'));
    blocks.push({r, from:d, len});
    d += len;
  }
  for(let d=0; d<n; d++){
    const blk = blocks.find(b=>d>=b.from && d<b.from+b.len);
    days.push({ sniadanie: rnd(pool('sniadanie')), obiad: blk.r, kolacja: rnd(pool('kolacja')), przekaska:null, _blk:blk });
  }
  /* przekąska tylko gdy brakuje kalorii */
  const pk = pool('przekaska');
  days.forEach((day, di)=>{
    const kTarget = celDnia('him', dayKey(di)) + celDnia('her', dayKey(di));
    const k = ['sniadanie','obiad','kolacja'].reduce((a,s)=>a+(day[s]?recipeTotals(day[s],1).kcal:0),0);
    if(k < kTarget-250 && pk.length) day.przekaska = rnd(pk);
  });
  return days;
}

function generatePlan(n){
  let best=null, bestScore=Infinity;
  for(let i=0;i<600;i++){
    const c = buildCandidate(n);
    const sc = planScore(c.map(d=>({a:d.sniadanie,b:d.obiad,c:d.kolacja,d:d.przekaska})));
    if(sc < bestScore){ bestScore = sc; best = c; }
  }
  /* zapis do planu */
  PLAN = {};
  best.forEach((day,d)=>{
    SLOTS.forEach(([sk])=>{
      const rec = day[sk]; if(!rec) return;
      if(sk==='obiad'){
        const blk = day._blk, first = (d === blk.from);
        PLAN[dayKey(d)+'|obiad'] = {r:rec.id, mul: first ? blk.len : 1, on: first};
      } else {
        PLAN[dayKey(d)+'|'+sk] = {r:rec.id, mul:1, on:true};
      }
    });
  });
  Object.keys(PLAN).forEach(k=>znacz('plan',k));
  save();
  /* podsumowanie */
  let k=0,b=0;
  best.forEach(day=>SLOTS.forEach(([sk])=>{ const r=day[sk]; if(!r) return; const t=recipeTotals(r,1); k+=t.kcal; b+=t.b; }));
  return {k: r0(k/n), b: r0(b/n)};
}

/* klucz do modelu trzymany WYŁĄCZNIE w tym telefonie — nie idzie do chmury
   i nie ma go w pliku aplikacji */
const aiKlucz = () => DB.get('aikey', '');

function przeliczSKL(){
  document.querySelectorAll('[data-sklq]').forEach(i=>{
    const x = SKL[+i.dataset.sklq]; if(!x || x.brak) return;
    const nowa = +i.value || 0;
    if(x.pid && P[x.pid]){
      x.q = nowa;
      const t = recipeTotals({ing:[[x.pid, x.q]]});
      x.kcal = t.kcal; x.b = t.b; x.tl = t.t; x.we = t.w;
    } else {
      /* pozycja oszacowana przez model nie ma produktu w bazie — skalujemy
         jej wartości proporcjonalnie do zmiany gramatury */
      const stara = x.q || nowa || 1;
      const f = stara ? nowa/stara : 1;
      x.kcal = r0((x.kcal||0)*f); x.b = r0((x.b||0)*f);
      x.tl = r0((x.tl||0)*f); x.we = r0((x.we||0)*f);
      x.q = nowa;
    }
  });
}

/* zmniejszamy zdjęcie przed wysłaniem — telefon robi 4 MB, modelowi wystarczy ułamek */
function zmniejsz(file, max=1024){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const sk = Math.min(1, max/Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*sk); c.height = Math.round(img.height*sk);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

const AI_ZADANIE = `Liczysz kalorie i makro dla pary na redukcji. Rozbij podane jedzenie na składniki z gramaturami i wartościami odżywczymi.

ZASADY, KTÓRE NAJCZĘŚCIEJ DECYDUJĄ O BŁĘDZIE:
- Mięso surowe kontra ugotowane to najczęstsza pomyłka. Surowa pierś z kurczaka to ok. 120 kcal i 22,5 g białka na 100 g, ugotowana lub pieczona ok. 165 kcal i 31 g białka, usmażona ok. 180 kcal i 6 g tłuszczu. Jeśli z opisu albo zdjęcia nie wynika jasno, w którym stanie jest mięso, ZAŁÓŻ wersję ugotowaną, ale koniecznie dopisz to w polu "pytanie".
- Gdy ktoś mówi "X gramów białka", ma na myśli X gramów PROSZKU odżywki białkowej, a nie X gramów białka jako makroskładnika. Licz makra z wartości odżywki na 100 g.
- Jeśli na etykiecie jest "opakowanie zawiera 1 porcję", licz całe opakowanie.
- Jedzenie z restauracji i na mieście: nie celuj w środek widełek, tylko w ich górną część. Tam prawie zawsze jest więcej tłuszczu i oleju, niż widać.
- Doliczaj tłuszcz ze smażenia, sosów i dressingów, o którym łatwo zapomnieć.
- Nie zaniżaj. Lepiej lekko przeszacować niż dać komuś fałszywe poczucie deficytu.
- Gramatury szacuj realistycznie dla porcji domowej, chyba że widać inaczej. Podawaj wartości dla całej widocznej porcji, nie na 100 g.

Odpowiedz WYŁĄCZNIE obiektem JSON, bez komentarza i bez znaczników kodu:
{"pozycje":[{"nazwa":"pierś z kurczaka, pieczona","gramy":180,"kcal":297,"bialko":56,"tluszcz":6,"wegle":0,"pewnosc":"wysoka"}],
 "pytanie":"jedno pytanie, jeśli odpowiedź na nie realnie zmieni wynik — inaczej pusty tekst",
 "uwaga":"jedno krótkie zdanie o tym, co było niepewne"}
pewnosc: "wysoka" | "srednia" | "niska"`;

async function zapytajAI(tresc){
  const klucz = aiKlucz();
  if(!klucz){ toast('Najpierw wpisz klucz w ⚙️ Ustawieniach'); return null; }
  toast('Liczę…');
  try{
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'content-type':'application/json','x-api-key':klucz,
               'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model:'claude-haiku-4-5', max_tokens:1200,
        messages:[{role:'user', content: tresc}]})
    });
    if(r.status===401){ toast('Klucz odrzucony — sprawdź go w ⚙️'); return null; }
    if(r.status===429){ toast('Za dużo zapytań naraz, spróbuj za chwilę'); return null; }
    if(!r.ok){ const t = await r.text(); toast('Błąd '+r.status+(t.includes('credit')?' — brak środków na koncie':'')); return null; }
    const d = await r.json();
    const txt = (d.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
    const m = txt.match(/\{[\s\S]*\}/);
    if(!m){ toast('Nie zrozumiałem odpowiedzi modelu'); return null; }
    return JSON.parse(m[0]);
  }catch(e){ toast('Nie udało się połączyć: '+e.message); return null; }
}

let aiPytanie = '';
function wynikAIdoSKL(dane){
  if(!dane || !Array.isArray(dane.pozycje)) return;
  aiPytanie = (dane.pytanie || '').trim();
  SKL = dane.pozycje.map(x=>({
    pid: null, q: +x.gramy||0, nazwa: String(x.nazwa||'?') + (x.pewnosc==='niska' ? ' (niepewne)' : ''),
    kcal: r0(+x.kcal||0), b: r0(+x.bialko||0), tl: r0(+x.tluszcz||0), we: r0(+x.wegle||0), zAI:true
  }));
  openSkladniki();
  if(dane.uwaga) setTimeout(()=>toast(String(dane.uwaga).slice(0,120)), 800);
}

async function zdjecieDoAI(file){
  const dataUrl = await zmniejsz(file).catch(()=>null);
  if(!dataUrl){ toast('Nie udało się otworzyć zdjęcia'); return; }
  sklZdjecie = dataUrl;
  openSkladniki();
  const b64 = dataUrl.split(',')[1];
  const opis = ($('#sklT') && $('#sklT').value.trim()) || '';
  const dane = await zapytajAI([
    {type:'image', source:{type:'base64', media_type:'image/jpeg', data:b64}},
    {type:'text', text: AI_ZADANIE + (opis ? '\n\nDodatkowy opis od użytkownika: ' + opis : '')}
  ]);
  wynikAIdoSKL(dane);
}

function wylow(txt){
  const t = String(txt||'').replace(/\s+/g,' ').trim();
  const klucz = (t.match(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/)||[])[0] || '';
  const adres = (t.match(/https:\/\/[a-z0-9-]+\.supabase\.co/i)||[])[0] || '';

}

/* ---------- scalanie po kluczach ----------
   TS[doc][klucz] = kiedy TEN telefon ostatnio zmienił ten wpis.
   Zegar jest monotoniczny: nigdy nie cofa się poniżej tego, co już widzieliśmy,
   więc rozjechany o kilka minut telefon nie „przegrywa” własnych świeżych zmian. */
let TS = DB.get('ts', {plan:{}, weight:{}, train:{}, pantry:{}, eaten:{}});
['plan','weight','train','pantry','eaten'].forEach(k=>{ TS[k] = TS[k] || {}; });
let zegarOffset = DB.get('zegarOffset', 0);
function teraz(){ return Date.now() + zegarOffset; }
function znacz(doc, klucz){
  TS[doc] = TS[doc] || {};
  TS[doc][klucz] = Math.max(teraz(), (TS[doc][klucz]||0) + 1);
  DB.set('ts', TS);
}
/* Dziennik ma dwa poziomy (dzień → osoba), a dopiski to listy. Scalamy więc
   osobno każdą osobę w każdym dniu, a rzeczy zjedzone „spoza planu” łączymy
   po identyfikatorach — dzięki temu batonik Jakuba i lody Gosi z tej samej
   godziny nie kasują się nawzajem. */
function scalDziennik(lokalne, paczka){
  const zdalne = (paczka && paczka.v) ? paczka.v : (paczka || {});
  const zt = (paczka && paczka.t) || {};
  TS.eaten = TS.eaten || {};
  const maxZ = Math.max(0, ...Object.values(zt).filter(x=>typeof x==='number'));
  if(maxZ > teraz()){ zegarOffset += (maxZ - teraz()) + 1000; DB.set('zegarOffset', zegarOffset); }
  const wynik = Object.assign({}, lokalne);
  new Set(Object.keys(zdalne||{}).concat(Object.keys(lokalne||{}))).forEach(dk=>{
    wynik[dk] = Object.assign({}, lokalne[dk]);
    ['him','her'].forEach(w=>{
      const kl = dk+'|'+w;
      const zd = (zdalne[dk]||{})[w], lo = (lokalne[dk]||{})[w];
      if(!zd){ if(lo) wynik[dk][w] = lo; return; }
      if(!lo){ wynik[dk][w] = zd; TS.eaten[kl] = zt[kl] || 0; return; }
      const nowszeZdalne = (zt[kl]||0) > (TS.eaten[kl]||0);
      /* dopiski: suma obu list, bez powtórek */
      const widz = {}, lista = [];
      (lo.extra||[]).concat(zd.extra||[]).forEach(x=>{
        const id = x.id || (x.n+'|'+x.k+'|'+x.b);
        if(widz[id]) return; widz[id]=1; lista.push(x);
      });
      wynik[dk][w] = { slots: nowszeZdalne ? Object.assign({}, lo.slots, zd.slots) : Object.assign({}, zd.slots, lo.slots),
                       extra: lista };
      if(nowszeZdalne) TS.eaten[kl] = zt[kl];
    });
  });
  DB.set('ts', TS);
  return wynik;
}

function scal(lokalne, doc, paczka, glebokie){
  const zdalne = (paczka && paczka.v) ? paczka.v : (paczka && !paczka.t ? paczka : {});
  const zt = (paczka && paczka.t) || {};
  TS[doc] = TS[doc] || {};
  /* jeśli druga strona ma zegar do przodu, dostrajamy się, żeby nasze kolejne
     zmiany nie były traktowane jako starsze */
  const maxZdalny = Math.max(0, ...Object.values(zt).filter(x=>typeof x==='number'));
  if(maxZdalny > teraz()) zegarOffset += (maxZdalny - teraz()) + 1000, DB.set('zegarOffset', zegarOffset);
  const wynik = Object.assign({}, lokalne);
  new Set(Object.keys(zdalne||{}).concat(Object.keys(lokalne||{}))).forEach(k=>{
    const lt = TS[doc][k] || 0, rt = zt[k] || 0;
    if(k in (zdalne||{})){
      if(rt > lt){
        if(glebokie && typeof zdalne[k]==='object' && typeof lokalne[k]==='object' && lokalne[k])
          wynik[k] = Object.assign({}, lokalne[k], zdalne[k]);
        else wynik[k] = zdalne[k];
        TS[doc][k] = rt;
      }
    } else if(rt === 0 && lt === 0){
      /* wpis, o którym druga strona nic nie wie i my go nie zmienialiśmy — zostaje */
    } else if(!(k in (zdalne||{})) && (zt.__kasacje||{})[k] > lt){
      delete wynik[k];
    }
  });
  DB.set('ts', TS);
  return wynik;
}

/* Kod pary leci w nagłówku przy KAŻDYM zapytaniu — reguła w bazie porównuje go

const sbHead = () => ({'apikey':SY.key, 'Authorization':'Bearer '+SY.key,
                       'Content-Type':'application/json', 'x-pair': SY.pair || ''});
const setStatus = s => { syncStatus = s; const b=$('#btnSync'); if(b) b.classList.toggle('live', s==='live'||s==='zapas'); if($('#syncBox')) openSync(); };

async function syncPull(){
  if(!SY.on) return;
  try{
    const r = await fetch(`${SY.url}/rest/v1/kuchnia?pair=eq.${encodeURIComponent(SY.pair)}&select=doc,data,client,updated_at`, {headers:sbHead()});
    if(r.status===401 || r.status===403){ setStatus('blad'); syncErr = 'Klucz jest nieprawidłowy — kliknij „Wstaw poprawny klucz”.'; return; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    syncErr = '';
    (await r.json()).forEach(applyRow);
    if(syncStatus==='laczenie'||syncStatus==='blad') setStatus(ws && ws.readyState===1 ? 'live' : 'zapas');
    renderAll();
  }catch(e){ setStatus('blad'); }
}

/* Sprawdza, czy dane z chmury mają sensowny kształt. Bez tego jeden uszkodzony
   wiersz potrafił zapisać null do pamięci telefonu i unieruchomić apkę na stałe. */
const KSZTALT = {
  plan:'obj', train:'obj', pantry:'obj', weight:'obj', eaten:'obj', prod:'obj', set:'obj',
  rec:'obj', msgs:'obj', bought:'obj'
};
function ksztaltOk(doc, v){
  if(v === null || v === undefined) return false;
  if(Array.isArray(v)) return doc==='rec' || doc==='msgs';      // stary format list
  return typeof v === 'object';
}

function applyRow(row){
  if(!row || !DOCS[row.doc]) return;
  if(!ksztaltOk(row.doc, row.data)){ console.warn('Pomijam uszkodzony wiersz:', row.doc); return; }
  if(row.client === CLIENT) return;                       // to nasz własny zapis
  const stamp = new Date(row.updated_at||0).getTime();
  if(row.doc!=='bought' && stamp <= (lastSeen[row.doc]||0)) return;
  lastSeen[row.doc] = stamp;
  DOCS[row.doc].set(row.data);
}

async function pushDoc(doc){
  const body = [{pair:SY.pair, doc, data:DOCS[doc].get(), client:CLIENT}];
  const r = await fetch(`${SY.url}/rest/v1/kuchnia?on_conflict=pair,doc`, {
    method:'POST',
    headers:Object.assign(sbHead(), {'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body: JSON.stringify(body)
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
}

async function pushChanged(){
  if(!SY.on) return;
  try{
    for(const doc of Object.keys(DOCS)){
      const s = JSON.stringify(DOCS[doc].get());
      if(s === lastSent[doc]) continue;
      await pushDoc(doc);
      lastSent[doc] = s;
    }
    if(syncStatus==='blad') setStatus(ws && ws.readyState===1 ? 'live' : 'zapas');
  }catch(e){ setStatus('blad'); }
}

/* --- kanał live --- */
function connectWS(){
  if(!SY.on || !window.WebSocket) return;
  try{ if(ws) ws.close(); }catch(e){}
  const wsUrl = SY.url.replace(/^http/,'ws') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(SY.key) + '&vsn=1.0.0';
  let ref = 0;
  try{ ws = new WebSocket(wsUrl); }catch(e){ startPolling(); return; }

  ws.onopen = () => {
    wsTry = 0;
    ws.send(JSON.stringify({topic:'realtime:kuchnia', event:'phx_join', ref:String(++ref), payload:{
      config:{ postgres_changes:[{event:'*', schema:'public', table:'kuchnia', filter:'pair=eq.'+SY.pair}] },
      access_token: SY.key
    }}));
    clearInterval(wsTimer);
    wsTimer = setInterval(()=>{ try{ ws.send(JSON.stringify({topic:'phoenix', event:'heartbeat', payload:{}, ref:String(++ref)})); }catch(e){} }, 25000);
    setStatus('live');
  };
  ws.onmessage = ev => {
    let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
    if(m.event === 'postgres_changes'){
      const rec = m.payload && m.payload.data && m.payload.data.record;
      if(rec){ applyRow(rec); renderAll(); }
    }
  };
  ws.onclose = () => {
    clearInterval(wsTimer);
    if(!SY.on) return;
    setStatus('zapas'); startPolling();
    wsTry++; setTimeout(connectWS, Math.min(30000, 2000*wsTry));
  };
  ws.onerror = () => { try{ ws.close(); }catch(e){} };
}
function startPolling(){ clearInterval(pollTimer); pollTimer = setInterval(()=>{ if(!document.hidden) syncPull(); }, 6000); }
function stopSync(){
  SY.on=false; DB.set('sync',SY);
  clearInterval(pollTimer); clearInterval(wsTimer); clearInterval(presTimer);
  try{ if(ws) ws.close(); }catch(e){}
  ws=null; setStatus('off');
}

  await pushChanged();
  await pushPresence();
  clearInterval(presTimer); presTimer = setInterval(pushPresence, 300000);
  connectWS(); startPolling();
}

/* sprawdza, czy drugi telefon w ogóle dotarł do bazy */
async function checkDevices(){
  const el = $('#syncDev'); if(!el) return;
  if(!SY.url || !SY.key || !SY.pair){ el.textContent = 'Najpierw włącz synchronizację.'; return; }
  try{
    const r = await fetch(`${SY.url}/rest/v1/kuchnia?pair=eq.${encodeURIComponent(SY.pair)}&select=doc,client,updated_at`, {headers:sbHead()});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows = await r.json();
    const meldunki = rows.filter(x=>String(x.doc).indexOf('dev:')===0);
    const inni = meldunki.length
      ? meldunki.map(x=>String(x.doc).slice(4)).filter(c=>c!==CLIENT)
      : [...new Set(rows.map(x=>x.client))].filter(c=>c && c!==CLIENT);
    const ost = rows.filter(x=>String(x.doc).indexOf('dev:')!==0).map(x=>x.updated_at).sort().pop();
    const godz = ost ? new Date(ost).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}) : '—';
    if(!rows.length){
      el.innerHTML = '⚠️ <b>Pod tym kodem nie ma jeszcze żadnych danych.</b><br>Kliknij „Włącz synchronizację”.';
    } else if(!inni.length){

function readEditor(){
  document.querySelectorAll('[data-ip]').forEach(s=>{ edIng[+s.dataset.ip][0] = s.value; });
  document.querySelectorAll('[data-iq]').forEach(s=>{ edIng[+s.dataset.iq][1] = +s.value||0; });
  document.querySelectorAll('[data-st]').forEach(s=>{ edSteps[+s.dataset.st] = s.value; });
  /* zapamiętujemy też górną część formularza — bez tego wpisana nazwa
     znikała przy dodaniu kolejnego składnika (formularz rysuje się od nowa) */
  if($('#eN')) edMeta = {
    n: $('#eN').value, em: $('#eE').value || '🍽️',
    t: +$('#eT').value || 20, typ: $('#eTyp').value,
    pieces: $('#eP').value
  };
}
function saveRecipe(){
  readEditor();
  const n = $('#eN').value.trim();
  if(!n){ toast('Wpisz nazwę przepisu'); return; }
  const rec = {
    id: edId || ('c'+Date.now()), custom:true, ts: teraz(), n,
    em: $('#eE').value.trim()||'🍽️',
    t: +$('#eT').value||20,
    typ: [$('#eTyp').value],
    pieces: +$('#eP').value||null,
    ing: edIng.filter(r=>r[1]>0),
    steps: edSteps.filter(s=>s && s.trim())
  };
  if(!rec.ing.length){ toast('Dodaj choć jeden składnik'); return; }
  if(!rec.steps.length) rec.steps = ['—'];
  const i = CUSTOM.findIndex(r=>r.id===rec.id);
  if(i>=0) CUSTOM[i] = rec; else CUSTOM.push(rec);
  DB.set('myrec', CUSTOM); save();
  closeSheet(); go('rec'); toast(i>=0 ? 'Zmiany zapisane ✓' : 'Przepis zapisany ✓');
}
function saveProduct(){
  const n = $('#pN').value.trim(); if(!n){ toast('Wpisz nazwę'); return; }
  const id = 'p'+Date.now();
  const jedn = $('#pU').value, gram = +$('#pG').value || null;
  if(jedn==='szt' && !gram){ toast('Przy sztukach podaj wagę jednej sztuki'); return; }
  MYP[id] = {n, a:$('#pA').value, u:jedn, kcal:+$('#pK').value||0,
             b:+$('#pB').value||0, t:+$('#pT').value||0, w:+$('#pW').value||0,
             pack:+$('#pP').value||null, gram};
  /* ostrzeżenie, gdy makro nie zgadza się z kaloriami — łatwo o literówkę */
  const zMakro = (MYP[id].b*4 + MYP[id].t*9 + MYP[id].w*4);
  if(MYP[id].kcal && zMakro && Math.abs(zMakro - MYP[id].kcal)/MYP[id].kcal > 0.25)
    setTimeout(()=>toast('Uwaga: z makro wychodzi ~'+r0(zMakro)+' kcal, a wpisałeś '+MYP[id].kcal), 900);
  P[id] = MYP[id]; DB.set('myprod', MYP); save();
  if(nowyZBraku !== null){
    /* produkt dodany z poziomu dopisywania jedzenia — wracamy tam i podstawiamy go */
    const poz = SKL[nowyZBraku];
    const ile = MYP[id].u==='szt' ? 1 : 100;
    const t = recipeTotals({ing:[[id, ile]]});
    if(poz) SKL[nowyZBraku] = {pid:id, q:ile, nazwa:MYP[id].n, kcal:t.kcal, b:t.b, tl:t.t, we:t.w};
    nowyZBraku = null;
    closeSheet(); openSkladniki(); toast('Produkt dodany — popraw ilość');
    return;
  }
  edIng.push([id, 100]);
  drawEditor(); toast('Produkt dodany ✓');
}

function saveWeight(){
  const d = iso(new Date());
  const v = {};
  const g = id => { const x = $(id).value; return x==='' ? undefined : +x; };
  v.him = g('#wHim'); v.her = g('#wHer'); v.waistHim = g('#pHim'); v.waistHer = g('#pHer');
  if(v.him===undefined && v.her===undefined){ toast('Wpisz choć jedną wagę'); return; }
  /* dopisujemy do istniejącego wpisu — puste pole nie kasuje pomiaru partnera */
  const stare = WEIGHT[d] || {};
  Object.keys(v).forEach(k=>{ if(v[k]===undefined) delete v[k]; });
  WEIGHT[d] = Object.assign({}, stare, v);
  znacz('weight', d);
  save(); renderWeight(); toast('Pomiar zapisany ✓');
}
function demoWeight(){
  const base = {him:92.4, her:68.1};
  for(let i=27;i>=0;i--){
    const dt = dayDate(-i), k = iso(dt);
    const wob = Math.sin(i*1.7)*0.55 + Math.cos(i*0.9)*0.35;
    WEIGHT[k] = { him: r1(base.him - (27-i)*0.055 + wob), her: r1(base.her - (27-i)*0.032 + wob*0.7) };
  }
  save(); renderWeight(); toast('Wgrane 28 dni przykładowych');
}
function shareList(){
  const {need} = buildList(); const out = [];
  /* to samo odjęcie spiżarni, co na ekranie — wcześniej SMS zawierał pełne
     ilości, więc w sklepie kupowaliście to, co już mieliście w domu */
  const doKup = {};
  Object.keys(need).forEach(pid=>{ const brak = need[pid] - (PANTRY[pid]||0); if(brak > 0.001) doKup[pid] = brak; });
  AISLES.forEach(([ak,an])=>{
    const inA = Object.keys(doKup).filter(i=>P[i] && P[i].a===ak);
    if(!inA.length) return;
    out.push('— '+an+' —');
    inA.forEach(pid=>{
      const p = P[pid];
      const opak = p.pack ? '  ('+Math.ceil(doKup[pid]/p.pack)+' × '+fmtQ(pid,p.pack)+')' : '';
      out.push('• '+p.n+' — '+fmtQ(pid,doKup[pid])+opak);
    });
  });
  const txt = 'Lista zakupów:\n'+out.join('\n');
  if(navigator.share) navigator.share({text:txt}).catch(()=>{});
  else if(navigator.clipboard){ navigator.clipboard.writeText(txt); toast('Lista skopiowana ✓'); }
  else toast('Skopiuj ręcznie z ekranu');
}
