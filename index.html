<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d5d">
<title>Nasza Kuchnia</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kuchnia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f7f4ef; --card:#ffffff; --ink:#23201c; --mut:#7d766c; --line:#e6e0d6;
  --acc:#2f7d5d; --acc-s:#e7f2ec; --her:#c2568b; --her-s:#fbeaf2; --him:#3a6ea5; --him-s:#e8f0f8;
  --warn:#b3651b; --warn-s:#fdf0e3; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{
  position:sticky;top:0;z-index:20;background:rgba(247,244,239,.93);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.hbar{display:flex;align-items:center;gap:10px;padding:12px 0 11px}
.hbar h1{font-size:19px;margin:0;flex:1;letter-spacing:-.3px}
.hbar .sub{font-size:12px;color:var(--mut);font-weight:400;display:block;letter-spacing:0}
.icobtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  font-size:17px;display:grid;place-items:center;cursor:pointer;flex:none}
.icobtn:active{transform:scale(.94)}
.icobtn.live{position:relative}
.icobtn.live:after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:#2f9e63;border:2px solid var(--card)}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav-in button{
  background:none;border:0;padding:9px 2px 10px;font:inherit;font-size:10.5px;color:var(--mut);
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav-in button .i{font-size:20px;line-height:1}
.nav-in button.on{color:var(--acc);font-weight:600}
section{display:none;padding:16px 0 24px;animation:in .18s ease}
section.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tight{padding:11px 13px}
h2{font-size:15px;margin:20px 0 9px;letter-spacing:-.2px}
h2:first-child{margin-top:0}
.muted{color:var(--mut);font-size:13px}
.tiny{font-size:11.5px;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
button.btn{
  background:var(--acc);color:#fff;border:0;border-radius:11px;padding:11px 15px;
  font:inherit;font-weight:600;font-size:14.5px;cursor:pointer}
button.btn:active{transform:scale(.98)}
button.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
button.btn.wide{width:100%}
button.btn:disabled{opacity:.45}
input,select,textarea{
  font:inherit;font-size:15px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;
  background:#fff;color:var(--ink);width:100%}
input:focus,select,textarea:focus{outline:2px solid var(--acc-s);border-color:var(--acc)}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:var(--acc-s);color:var(--acc)}
.pill.g{background:#eee9e0;color:var(--mut)}
.pill.w{background:var(--warn-s);color:var(--warn)}
.him{color:var(--him)} .her{color:var(--her)}
.chip-him{background:var(--him-s);color:var(--him)} .chip-her{background:var(--her-s);color:var(--her)}
/* --- plan --- */
.daytabs{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.daytabs button{flex:none;padding:8px 13px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);font:inherit;font-size:13.5px;cursor:pointer;text-align:center}
.daytabs button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.daytabs button b{display:block;font-size:11px;font-weight:500;opacity:.7}
.slot{border-bottom:1px solid var(--line);padding:11px 0}
.slot:last-child{border-bottom:0;padding-bottom:0}
.slot-h{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700;margin-bottom:6px}
.meal{display:flex;align-items:center;gap:10px}
.meal .nm{flex:1;font-size:14.5px;font-weight:600;line-height:1.25}
.meal .nm small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:#fff;flex:none;
  display:grid;place-items:center;cursor:pointer;color:#fff;font-size:15px;font-weight:800}
.chk.on{background:var(--acc);border-color:var(--acc)}
.emptyslot{color:var(--mut);font-size:14px;flex:1}
.xmul{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 7px;font:inherit;
  font-size:12px;font-weight:700;color:var(--acc);cursor:pointer;flex:none}
/* --- lista zakupów --- */
.aisle{margin-bottom:6px}
.aisle-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;color:var(--mut);margin:16px 0 6px}
.aisle-h:before{content:"";height:1px;background:var(--line);flex:1;order:2}
.item{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .txt{flex:1;line-height:1.3}
.item .txt b{font-weight:600;font-size:14.5px}
.item.done .txt{text-decoration:line-through;opacity:.4}
.leftover{font-size:11.5px;color:var(--warn);margin-top:3px}
.leftover b{font-weight:700}
.sum{background:var(--acc-s);border:0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcol .pnm{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.pcol .pv{font-size:18px;font-weight:800;letter-spacing:-.5px}
.pcol .pv2{font-size:14px;font-weight:700;margin-top:7px}
.pcol small{font-size:11px;font-weight:500;color:var(--mut)}
.pbar{height:5px;border-radius:3px;background:#eee9e0;margin-top:4px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px}
.sum .big{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--acc)}
/* --- przepisy --- */
.rlist{display:flex;flex-direction:column;gap:9px}
.ritem{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 13px;cursor:pointer;text-align:left;font:inherit;width:100%}
.ritem:active{transform:scale(.995)}
.ritem .em{font-size:24px;flex:none}
.ritem .nm{flex:1}
.ritem .nm b{display:block;font-size:14.5px;font-weight:600}
.ritem .nm span{font-size:12px;color:var(--mut)}
.ing{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.ing:last-child{border-bottom:0}
.ing .q{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
ol.steps{margin:0;padding-left:20px}
ol.steps li{margin-bottom:7px;font-size:14.5px}
.macro{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--mut)}
.macro b{color:var(--ink);font-weight:700}
.plate{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.plate .p{border-radius:12px;padding:11px 12px}
.plate .p .who{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.75}
.plate .p .v{font-size:23px;font-weight:800;letter-spacing:-.8px;margin:2px 0 1px}
.plate .p .k{font-size:12px;opacity:.8}
.seg{display:flex;background:#efeae1;border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:13px;padding:7px 4px;border-radius:8px;cursor:pointer;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.07)}
/* --- modal --- */
.ov{position:fixed;inset:0;background:rgba(30,26,22,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:0 14px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.sheet-h{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet-h h3{margin:0;font-size:17px;flex:1;letter-spacing:-.3px}
.grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:8px auto -4px}
/* --- waga --- */
canvas{width:100%;height:230px;display:block}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.stat .s{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat .s .v{font-size:19px;font-weight:800;letter-spacing:-.5px}
.stat .s .l{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
table.log{width:100%;border-collapse:collapse;font-size:13.5px}
table.log th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:6px 4px;border-bottom:1px solid var(--line)}
table.log td{padding:7px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.note{background:var(--warn-s);border:1px solid #f0dcc4;border-radius:12px;padding:11px 12px;font-size:13px;color:#6b431a}
.note b{color:var(--warn)}
.ok{background:var(--acc-s);border:1px solid #cfe4d9;border-radius:12px;padding:11px 12px;font-size:13px;color:#1f5a42}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}
.empty .em{font-size:34px;display:block;margin-bottom:8px;opacity:.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));
  background:#23201c;color:#fff;padding:10px 16px;border-radius:11px;font-size:13.5px;z-index:60;
  opacity:0;pointer-events:none;transition:.2s;max-width:90%}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <div style="flex:1">
      <h1 id="hTitle">Plan na 3 dni</h1>
      <span class="sub" id="hSub">—</span>
    </div>
    <button class="icobtn" id="btnMsg" title="Napisz do Claude'a">💬</button>
    <button class="icobtn" id="btnSync" title="Para w sklepie">👫</button>
    <button class="icobtn" id="btnSet" title="Ustawienia">⚙️</button>
  </div>
</header>

<main class="wrap">
  <section id="s-plan" class="on"></section>
  <section id="s-shop"></section>
  <section id="s-rec"></section>
  <section id="s-fridge"></section>
  <section id="s-weight"></section>
</main>

<nav><div class="nav-in">
  <button data-t="plan" class="on"><span class="i">🗓️</span>Plan</button>
  <button data-t="shop"><span class="i">🛒</span>Zakupy</button>
  <button data-t="rec"><span class="i">📖</span>Przepisy</button>
  <button data-t="fridge"><span class="i">🧊</span>Lodówka</button>
  <button data-t="weight"><span class="i">⚖️</span>Waga</button>
</div></nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ==========================================================================
   NASZA KUCHNIA — prototyp
   Wszystko w jednym pliku. Dane zapisują się w pamięci telefonu.
   ========================================================================== */

/* --- 1. TRWAŁY ZAPIS (bezpieczny, nie wywala się gdy pamięć zablokowana) --- */
const mem = {};
const DB = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? (k in mem ? mem[k] : d) : JSON.parse(v); }
             catch(e){ return (k in mem) ? mem[k] : d; } },
  set(k, v){ mem[k]=v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* --- 2. ALEJKI W SKLEPIE (kolejność = kolejność chodzenia po sklepie) --- */
const AISLES = [
  ['warzywa','Warzywa i owoce','🥬'],
  ['pieczywo','Pieczywo','🥖'],
  ['nabial','Nabiał','🥛'],
  ['mieso','Mięso i ryby','🍗'],
  ['sypkie','Sypkie i konserwy','🥫'],
  ['mrozone','Mrożonki','🧊'],
  ['napoje','Napoje','🧃'],
  ['przyprawy','Suplementy i przyprawy','🧂'],
  ['chemia','Chemia i inne','🧴']
];

/* --- 3. PRODUKTY ---------------------------------------------------------
   u  : jednostka (g / ml / szt)
   kcal: na 100 g / 100 ml, a dla "szt" — za sztukę
   pack: wielkość opakowania w sklepie (null = kupujesz na wagę)
   gram: ile waży 1 sztuka (tylko dla u:'szt')                              */
const P = {
  serek:     {n:'Serek wiejski',        a:'nabial', u:'g',  kcal:98, b:11, t:4.3, w:3.4,  pack:200, o:1},
  twarog:    {n:'Twaróg półtłusty',     a:'nabial', u:'g',  kcal:133, b:18, t:4.7, w:3.5, pack:250, o:1},
  skyr:      {n:'Skyr naturalny',       a:'nabial', u:'g',  kcal:63, b:11, t:0.2, w:4,  pack:150, o:1},
  jogurt:    {n:'Jogurt grecki',        a:'nabial', u:'g',  kcal:97, b:6.4, t:5, w:4,  pack:400, o:1},
  mleko:     {n:'Mleko 2%',             a:'nabial', u:'ml', kcal:51, b:3.3, t:2, w:4.8,  pack:1000, o:1},
  serzolty:  {n:'Ser żółty',            a:'nabial', u:'g',  kcal:350, b:25, t:27, w:1, pack:150, o:1},
  maslo:     {n:'Masło',                a:'nabial', u:'g',  kcal:735, b:0.7, t:81, w:0.7, pack:200},
  feta:      {n:'Feta',                 a:'nabial', u:'g',  kcal:264, b:14, t:21, w:4, pack:200, o:1},
  jajko:     {n:'Jajka',                a:'nabial', u:'szt',kcal:70, b:6.5, t:4.8, w:0.4,  pack:10, gram:55, o:1},

  kurczak:   {n:'Pierś z kurczaka',     a:'mieso',  u:'g',  kcal:165, b:31, t:3.6, w:0, pack:null},
  indyk:     {n:'Mielone z indyka',     a:'mieso',  u:'g',  kcal:150, b:20, t:8, w:0, pack:500, o:1},
  losos:     {n:'Łosoś (filet)',        a:'mieso',  u:'g',  kcal:200, b:20, t:13, w:0, pack:null},
  tunczyk:   {n:'Tuńczyk w wodzie',     a:'sypkie', u:'g',  kcal:100, b:23, t:1, w:0, pack:120, o:1},
  szynka:    {n:'Szynka drobiowa',      a:'mieso',  u:'g',  kcal:110, b:18, t:4, w:1, pack:100, o:1},

  passata:   {n:'Passata pomidorowa',   a:'sypkie', u:'g',  kcal:35, b:1.5, t:0.2, w:6,  pack:500, o:1},
  ryz:       {n:'Ryż biały (suchy)',    a:'sypkie', u:'g',  kcal:350, b:7, t:0.7, w:78, pack:1000},
  makaron:   {n:'Makaron pełnoziarnisty',a:'sypkie',u:'g',  kcal:350, b:12, t:2, w:68, pack:500},
  kasza:     {n:'Kasza gryczana',       a:'sypkie', u:'g',  kcal:336, b:13, t:3.4, w:65, pack:400},
  platki:    {n:'Płatki owsiane',       a:'sypkie', u:'g',  kcal:379, b:13, t:7, w:60, pack:500},
  maka:      {n:'Mąka pszenna',         a:'sypkie', u:'g',  kcal:364, b:10, t:1, w:76, pack:1000},
  ciecierzyca:{n:'Ciecierzyca z puszki',a:'sypkie', u:'g',  kcal:120, b:7, t:2, w:17, pack:240, o:1},
  oliwa:     {n:'Oliwa z oliwek',       a:'sypkie', u:'ml', kcal:884, b:0, t:100, w:0, pack:500},
  mo:        {n:'Masło orzechowe',      a:'sypkie', u:'g',  kcal:600, b:25, t:50, w:12, pack:350},
  miod:      {n:'Miód',                 a:'sypkie', u:'g',  kcal:320, b:0.3, t:0, w:80, pack:400},

  chleb:     {n:'Chleb żytni',          a:'pieczywo',u:'g', kcal:250, b:7, t:1.5, w:48, pack:500},
  tortilla:  {n:'Tortilla pełnoziarnista',a:'pieczywo',u:'szt',kcal:150, b:4, t:3.5, w:25,pack:8,gram:45, o:1},

  pomidor:   {n:'Pomidory',             a:'warzywa',u:'g',  kcal:18, b:0.9, t:0.2, w:3.5,  pack:null},
  papryka:   {n:'Papryka czerwona',     a:'warzywa',u:'g',  kcal:26, b:1, t:0.3, w:5,  pack:null},
  cebula:    {n:'Cebula',               a:'warzywa',u:'g',  kcal:40, b:1.1, t:0.1, w:8,  pack:null},
  czosnek:   {n:'Czosnek',              a:'warzywa',u:'g',  kcal:149, b:6, t:0.5, w:28, pack:null},
  cukinia:   {n:'Cukinia',              a:'warzywa',u:'g',  kcal:17, b:1.2, t:0.3, w:2,  pack:null},
  ogorek:    {n:'Ogórek',               a:'warzywa',u:'g',  kcal:15, b:0.7, t:0.1, w:2.5,  pack:null},
  szpinak:   {n:'Szpinak świeży',       a:'warzywa',u:'g',  kcal:23, b:2.9, t:0.4, w:1.5,  pack:150, o:1},
  salata:    {n:'Sałata / mix',         a:'warzywa',u:'g',  kcal:15, b:1.4, t:0.2, w:1.5,  pack:150, o:1},
  pieczarki: {n:'Pieczarki',            a:'warzywa',u:'g',  kcal:22, b:3.1, t:0.3, w:1,  pack:250, o:1},
  banan:     {n:'Banany',               a:'warzywa',u:'g',  kcal:89, b:1.1, t:0.3, w:20,  pack:null},
  jagody:    {n:'Mrożone owoce leśne',  a:'mrozone',u:'g',  kcal:45, b:0.8, t:0.4, w:9,  pack:400, o:1},
  brokul:    {n:'Brokuł mrożony',       a:'mrozone',u:'g',  kcal:34, b:2.8, t:0.4, w:4,  pack:450, o:1},

  odzywka:   {n:'Odżywka białkowa',     a:'przyprawy',u:'g',kcal:380, b:75, t:5, w:8, pack:700},
  przyprawy: {n:'Przyprawy (sól, pieprz, zioła)',a:'przyprawy',u:'g',kcal:0, b:0, t:0, w:0,pack:null}
};

/* --- 4. PRZEPISY ---------------------------------------------------------
   Schemat: składniki na Waszą dwójkę (wrzucasz do jednej miski),
   1–3 krótkie kroki, i nakładanie na gramy albo na sztuki.
   pieces = na ile kawałków/sztuk kroi się gotowe danie (null = tylko gramy) */
const R = [
 {id:'r1', n:'Placki z serka wiejskiego', em:'🥞', t:20, typ:['sniadanie'], pieces:10,
  ing:[['serek',400],['jajko',2],['maka',100],['platki',60],['miod',20]],
  steps:['Zmiksuj serek, jajka, mąkę i płatki na gładką masę.',
         'Smaż na suchej patelni po 2–3 min z każdej strony.',

const r0 = n => Math.round(n);
const r1 = n => Math.round(n*10)/10;

const shareHim = () => S.himKcal / (S.himKcal + S.herKcal);

/* ile waży i ile ma kalorii całe danie (na dwoje) */
function recipeTotals(rec, mul=1){
  let g=0, kcal=0, b=0, t=0, w=0;
  rec.ing.forEach(([pid,q])=>{
    const p = P[pid]; if(!p) return;
    const Q = q*mul;
    const f = p.u==='szt' ? Q : Q/100;      // ile "porcji tabelowych" produktu
    g    += p.u==='szt' ? Q*(p.gram||0) : Q;
    kcal += f*(p.kcal||0);
    b    += f*(p.b||0); t += f*(p.t||0); w += f*(p.w||0);
  });
  return {g:r0(g), kcal:r0(kcal), b:r0(b), t:r0(t), w:r0(w)};
}
const recById = id => R.find(x=>x.id===id);
function fmtQ(pid, q){
  const p = P[pid];
  if(p.u==='szt') return r1(q) + ' ' + (q===1?'szt':'szt');
  if(q>=1000) return r1(q/1000) + (p.u==='ml'?' l':' kg');
  return r0(q) + ' ' + p.u;
}

function buildList(){
  const need = {}, from = {};
  Object.entries(PLAN).forEach(([k,e])=>{
    if(!e || e.on===false) return;
    const rec = recById2(e.r); if(!rec) return;
    rec.ing.forEach(([pid,q])=>{
      if(!P[pid]) return;
      need[pid] = (need[pid]||0) + q*(e.mul||1);
      (from[pid] = from[pid]||[]).push(rec.n);
    });
  });
  return {need, from};
}

function renderShop(){
  const {need, from} = buildList();
  const ids = Object.keys(need);
  const d = [];

  if(!ids.length){
    $('#s-shop').innerHTML = '<div class="empty"><span class="em">🛒</span>Nic jeszcze nie zaznaczone.<br>Wejdź w Plan i zaznacz ptaszkami dania.</div>';
    return;
  }

  const doneCnt = ids.filter(i=>BOUGHT[i]).length;
  d.push('<div class="card sum between"><div>');
  d.push(`<div class="tiny" style="color:#1f5a42">Lista na ${S.days} dni</div><div class="big">${doneCnt}/${ids.length}</div>`);
  d.push('</div><button class="btn ghost sm" data-clear="1">Wyczyść ptaszki</button></div>');

  /* ostrzeżenia o otwartych resztkach */
  const warns = [];
  ids.forEach(pid=>{
    const p = P[pid]; if(!p.pack || !p.o) return;
    const packs = Math.ceil(need[pid]/p.pack), rest = packs*p.pack - need[pid];
    if(rest >= p.pack*0.34){
      const alt = ALL().filter(r => r.ing.some(([x])=>x===pid) && !from[pid].includes(r.n));
      warns.push({pid, rest, alt: alt[0]});
    }
  });
  if(warns.length){
    d.push('<div class="note" style="margin-bottom:12px"><b>Zostaną otwarte resztki:</b><br>');
    warns.slice(0,4).forEach(w=>{
      d.push(`• ${esc(P[w.pid].n)} — zostanie ${fmtQ(w.pid,w.rest)}`);
      if(w.alt) d.push(` → zużyjecie to w: <b>${esc(w.alt.n)}</b>`);
      d.push('<br>');
    });
    if(warns.length>4) d.push(`<span class="tiny">…i jeszcze ${warns.length-4} drobiazgów</span>`);
    d.push('</div>');
  }

  AISLES.forEach(([ak,an,ae])=>{
    const inA = ids.filter(i=>P[i].a===ak).sort((a,b)=>P[a].n.localeCompare(P[b].n,'pl'));
    if(!inA.length) return;
    d.push(`<div class="aisle-h"><span>${ae} ${an}</span></div><div class="card">`);
    inA.forEach(pid=>{
      const p = P[pid], q = need[pid];
      let packInfo = '';
      if(p.pack){
        const packs = Math.ceil(q/p.pack), rest = packs*p.pack - q;
        packInfo = `<div class="tiny">${packs} × opakowanie ${fmtQ(pid,p.pack)}` + (rest>0 ? ` <span style="color:var(--warn)">• zostanie ${fmtQ(pid,rest)}</span>` : ' <span style="color:var(--acc)">• równo</span>') + '</div>';
      }
      d.push(`<div class="item ${BOUGHT[pid]?'done':''}" data-buy="${pid}">
        <button class="chk ${BOUGHT[pid]?'on':''}">✓</button>
        <div class="txt"><b>${esc(p.n)} — ${fmtQ(pid,q)}</b>${packInfo}
        <div class="tiny" style="opacity:.75">${esc([...new Set(from[pid])].join(' + '))}</div></div></div>`);
    });
    d.push('</div>');
  });

  d.push('<button class="btn ghost wide" data-share="1" style="margin-top:6px">📤 Wyślij listę (SMS / WhatsApp)</button>');
  $('#s-shop').innerHTML = d.join('');
}

let fridgeTxt = DB.get('fridge','');
function renderFridge(){
  const d = [];

  d.push(`<textarea id="frq" rows="3" placeholder="np. 2 jajka, pół passaty, ser żółty">${esc(fridgeTxt)}</textarea></label>`);

  const words = fridgeTxt.toLowerCase().split(/[,;\n]+|\si\s/).map(s=>s.trim()).filter(Boolean);
  if(words.length){
    const have = new Set();
    Object.keys(P).forEach(pid=>{
      const name = P[pid].n.toLowerCase();
      words.forEach(w=>{
        const core = w.replace(/[0-9]/g,'').replace(/\b(g|kg|ml|szt|pół|pol|opak\.?|opakowania?|sztuki?|resztka)\b/g,'').trim();
        if(core.length>2 && (name.includes(core.slice(0,Math.min(core.length,6))) || core.includes(name.toLowerCase().split(' ')[0].slice(0,6)))) have.add(pid);
      });
    });
    const scored = ALL().map(r=>{
      const hits = r.ing.filter(([p])=>have.has(p)).length;
      const miss = r.ing.filter(([p])=>!have.has(p) && p!=='przyprawy');
      return {r, hits, miss, pct: Math.round(hits/r.ing.length*100)};
    }).filter(x=>x.hits>0).sort((a,b)=>b.pct-a.pct || a.miss.length-b.miss.length);

    d.push(`<h2>Rozpoznane produkty: ${have.size ? [...have].map(p=>esc(P[p].n)).join(', ') : '—'}</h2>`);
    if(!scored.length) d.push('<div class="empty">Nic nie pasuje. Spróbuj innych nazw.</div>');
    d.push('<div class="rlist">');
    scored.slice(0,8).forEach(({r,pct,miss})=>{
      d.push(`<button class="ritem" data-open="${r.id}"><span class="em">${r.em||'🍽️'}</span>

        <span class="pill">${pct}%</span></button>`);
    });
    d.push('</div>');
  }
  $('#s-fridge').innerHTML = d.join('');
  const t = $('#frq');
  t.oninput = e => { fridgeTxt = e.target.value; DB.set('fridge', fridgeTxt); };
}

function weightRows(){
  return Object.entries(WEIGHT).map(([d,v])=>Object.assign({d}, v)).sort((a,b)=>a.d<b.d?-1:1);
}
function movAvg(rows, key, win=7){
  return rows.map((r,i)=>{
    const s = rows.slice(Math.max(0,i-win+1), i+1).map(x=>x[key]).filter(v=>typeof v==='number');
    return s.length ? s.reduce((a,b)=>a+b,0)/s.length : null;
  });
}
function renderWeight(){
  const rows = weightRows(), d = [];
  const today = iso(new Date());
  const t = WEIGHT[today] || {};

  d.push('<div class="card"><div class="between" style="margin-bottom:10px"><b style="font-size:14.5px">Pomiar — rano, na czczo</b><span class="pill g">'+today.split('-').reverse().join('.')+'</span></div>');
  d.push('<div class="grid2">');
  d.push(`<label class="f"><span class="him">${esc(S.himName)} — waga (kg)</span><input id="wHim" type="number" step="0.1" inputmode="decimal" value="${t.him??''}"></label>`);
  d.push(`<label class="f"><span class="her">${esc(S.herName)} — waga (kg)</span><input id="wHer" type="number" step="0.1" inputmode="decimal" value="${t.her??''}"></label>`);
  d.push(`<label class="f"><span class="him">${esc(S.himName)} — pas (cm)</span><input id="pHim" type="number" step="0.5" inputmode="decimal" value="${t.waistHim??''}"></label>`);
  d.push(`<label class="f"><span class="her">${esc(S.herName)} — pas (cm)</span><input id="pHer" type="number" step="0.5" inputmode="decimal" value="${t.waistHer??''}"></label>`);
  d.push('</div><button class="btn wide" data-wsave="1">Zapisz pomiar</button></div>');

  if(rows.length>=2){
    const aHim = movAvg(rows,'him'), aHer = movAvg(rows,'her');
    const last = (a)=>{ for(let i=a.length-1;i>=0;i--) if(a[i]!=null) return a[i]; return null; };
    const week = (a)=>{ const l=last(a); const idx=Math.max(0,a.length-8); const p=a[idx]; return (l!=null&&p!=null)? l-p : null; };
    const fmtD = v => v==null?'—':(v>0?'+':'')+r1(v)+' kg';
    d.push('<h2>Średnia z 7 dni (to jest prawdziwy wynik)</h2>');
    d.push('<div class="stat">');
    d.push(`<div class="s"><div class="l him">${esc(S.himName)} śr.</div><div class="v">${last(aHim)!=null?r1(last(aHim)):'—'}</div></div>`);
    d.push(`<div class="s"><div class="l her">${esc(S.herName)} śr.</div><div class="v">${last(aHer)!=null?r1(last(aHer)):'—'}</div></div>`);

function drawChart(rows){
  const cv = $('#cv'); if(!cv) return;
  const dpr = window.devicePixelRatio||1, W = cv.clientWidth, H = 230;
  cv.width = W*dpr; cv.height = H*dpr;
  const x = cv.getContext('2d'); x.scale(dpr,dpr); x.clearRect(0,0,W,H);
  /* dwa osobne panele — każdy ma własną skalę, żeby było widać ruch */
  const L=34, Rr=8, gap=14, ph=(H-gap)/2;
  const panels = [
    {k:'him', c:'#3a6ea5', nm:S.himName, top:2},
    {k:'her', c:'#c2568b', nm:S.herName, top:2+ph+gap}
  ];
  const px = i => L + (W-L-Rr) * (rows.length<2 ? 0.5 : i/(rows.length-1));
  x.font='10px sans-serif'; x.lineWidth=1;
  panels.forEach(pn=>{
    const vals = rows.map(r=>r[pn.k]).filter(v=>typeof v==='number');
    if(vals.length<2) return;
    let mn=Math.min(...vals), mx=Math.max(...vals);
    const pv=Math.max(0.4,(mx-mn)*0.22); mn-=pv; mx+=pv;
    const t=pn.top+14, h=ph-18;
    const py = v => t + h*(1-(v-mn)/(mx-mn));
    x.strokeStyle='#eee9e0';
    [0,.5,1].forEach(f=>{ const y=t+h*f; x.beginPath(); x.moveTo(L,y); x.lineTo(W-Rr,y); x.stroke(); });
    x.fillStyle='#a39b8f';
    x.fillText(r1(mx),2,t+4); x.fillText(r1(mn),2,t+h+4);
    x.fillStyle=pn.c; x.font='bold 10px sans-serif';
    x.fillText(pn.nm.toUpperCase(), L, pn.top+9);
    x.font='10px sans-serif';
    x.fillStyle = pn.c+'4d';
    rows.forEach((r,i)=>{ if(typeof r[pn.k]!=='number') return; x.beginPath(); x.arc(px(i),py(r[pn.k]),2.6,0,7); x.fill(); });
    x.strokeStyle=pn.c; x.lineWidth=2.4; x.beginPath(); let st=false;
    movAvg(rows,pn.k).forEach((v,i)=>{ if(v==null) return; const X=px(i),Y=py(v); st?x.lineTo(X,Y):x.moveTo(X,Y); st=true; });
    x.stroke();
  });
}

/* ==========================================================================
   AUTOMATYCZNE UKŁADANIE PLANU
   Losuje setki wariantów i wybiera ten, który najlepiej trafia w cele
   kaloryczne i białkowe, nie powtarza dań i najlepiej zużywa opakowania.
   ========================================================================== */
let autoOpt = {batch:true, quick:false};

function pool(slot){
  let p = ALL().filter(r=>(r.typ||[]).includes(slot));
  if(autoOpt.quick) { const f = p.filter(r=>(r.t||15)<=25); if(f.length) p = f; }
  return p.length ? p : ALL();
}
const rnd = a => a[Math.floor(Math.random()*a.length)];

function planScore(days){
  const kTarget = S.himKcal + S.herKcal, bTarget = S.himProt + S.herProt;
  let score = 0; const used = {}; const counts = {};
  days.forEach(day=>{
    let k=0, b=0;
    Object.values(day).forEach(rec=>{
      if(!rec) return;
      const t = recipeTotals(rec,1); k += t.kcal; b += t.b;
      counts[rec.id] = (counts[rec.id]||0)+1;
      rec.ing.forEach(([pid])=>{ used[pid] = (used[pid]||0)+1; });
    });
    score += Math.abs(k - kTarget);                       // odchyłka kaloryczna
    score += Math.max(0, bTarget - b) * 6;                // brak białka boli mocno
    score += Math.max(0, b - bTarget*1.4) * 1;            // absurdalny nadmiar też
  });
  Object.values(counts).forEach(c=>{ if(c>2) score += (c-2)*400; });   // za dużo powtórek
  const shared = Object.values(used).filter(c=>c>1).length;
  score -= shared * 25;                                   // premia za wspólne opakowania
  return score;
}

function buildCandidate(n){
  const days = [];
  /* obiady: bloki po 2 dni przy gotowaniu na zapas */
  const ob = pool('obiad').slice(), blocks = [];
  for(let d=0; d<n; ){
    const len = autoOpt.batch ? Math.min(2, n-d) : 1;
    let r;
    if(ob.length){ const i = Math.floor(Math.random()*ob.length); r = ob.splice(i,1)[0]; }
    else r = rnd(pool('obiad'));
    blocks.push({r, from:d, len});
    d += len;
  }
  for(let d=0; d<n; d++){
    const blk = blocks.find(b=>d>=b.from && d<b.from+b.len);
    days.push({ sniadanie: rnd(pool('sniadanie')), obiad: blk.r, kolacja: rnd(pool('kolacja')), przekaska:null, _blk:blk });
  }
  /* przekąska tylko gdy brakuje kalorii */
  const kTarget = S.himKcal + S.herKcal, pk = pool('przekaska');
  days.forEach(day=>{
    const k = ['sniadanie','obiad','kolacja'].reduce((a,s)=>a+(day[s]?recipeTotals(day[s],1).kcal:0),0);
    if(k < kTarget-250 && pk.length) day.przekaska = rnd(pk);
  });
  return days;
}

function generatePlan(n){
  let best=null, bestScore=Infinity;
  for(let i=0;i<600;i++){
    const c = buildCandidate(n);
    const sc = planScore(c.map(d=>({a:d.sniadanie,b:d.obiad,c:d.kolacja,d:d.przekaska})));
    if(sc < bestScore){ bestScore = sc; best = c; }
  }
  /* zapis do planu */
  PLAN = {};
  best.forEach((day,d)=>{
    SLOTS.forEach(([sk])=>{
      const rec = day[sk]; if(!rec) return;
      if(sk==='obiad'){
        const blk = day._blk, first = (d === blk.from);
        PLAN[d+'-obiad'] = {r:rec.id, mul: first ? blk.len : 1, on: first};
      } else {
        PLAN[d+'-'+sk] = {r:rec.id, mul:1, on:true};
      }
    });
  });
  save();
  /* podsumowanie */
  let k=0,b=0;
  best.forEach(day=>SLOTS.forEach(([sk])=>{ const r=day[sk]; if(!r) return; const t=recipeTotals(r,1); k+=t.kcal; b+=t.b; }));
  return {k: r0(k/n), b: r0(b/n)};
}

const sbHead = () => ({'apikey':SY.key, 'Authorization':'Bearer '+SY.key, 'Content-Type':'application/json'});
const setStatus = s => { syncStatus = s; const b=$('#btnSync'); if(b) b.classList.toggle('live', s==='live'||s==='zapas'); if($('#syncBox')) openSync(); };

async function syncPull(){
  if(!SY.on) return;
  try{
    const r = await fetch(`${SY.url}/rest/v1/kuchnia?pair=eq.${encodeURIComponent(SY.pair)}&select=doc,data,client,updated_at`, {headers:sbHead()});
    if(!r.ok) throw new Error('HTTP '+r.status);
    (await r.json()).forEach(applyRow);
    if(syncStatus==='laczenie'||syncStatus==='blad') setStatus(ws && ws.readyState===1 ? 'live' : 'zapas');
    renderAll();
  }catch(e){ setStatus('blad'); }
}

function applyRow(row){
  if(!row || !DOCS[row.doc]) return;
  if(row.client === CLIENT) return;                       // to nasz własny zapis
  const stamp = new Date(row.updated_at||0).getTime();
  if(row.doc!=='bought' && stamp <= (lastSeen[row.doc]||0)) return;
  lastSeen[row.doc] = stamp;
  DOCS[row.doc].set(row.data);
}

async function pushDoc(doc){
  const body = [{pair:SY.pair, doc, data:DOCS[doc].get(), client:CLIENT}];
  const r = await fetch(`${SY.url}/rest/v1/kuchnia?on_conflict=pair,doc`, {
    method:'POST',
    headers:Object.assign(sbHead(), {'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body: JSON.stringify(body)
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
}

async function pushChanged(){
  if(!SY.on) return;
  try{
    for(const doc of Object.keys(DOCS)){
      const s = JSON.stringify(DOCS[doc].get());
      if(s === lastSent[doc]) continue;
      await pushDoc(doc);
      lastSent[doc] = s;
    }
    if(syncStatus==='blad') setStatus(ws && ws.readyState===1 ? 'live' : 'zapas');
  }catch(e){ setStatus('blad'); }
}
function schedulePush(){ if(!SY.on) return; clearTimeout(pushTimer); pushTimer = setTimeout(pushChanged, 400); }

/* --- kanał live --- */
function connectWS(){
  if(!SY.on || !window.WebSocket) return;
  try{ if(ws) ws.close(); }catch(e){}
  const wsUrl = SY.url.replace(/^http/,'ws') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(SY.key) + '&vsn=1.0.0';
  let ref = 0;
  try{ ws = new WebSocket(wsUrl); }catch(e){ startPolling(); return; }

  ws.onopen = () => {
    wsTry = 0;
    ws.send(JSON.stringify({topic:'realtime:kuchnia', event:'phx_join', ref:String(++ref), payload:{
      config:{ postgres_changes:[{event:'*', schema:'public', table:'kuchnia', filter:'pair=eq.'+SY.pair}] },
      access_token: SY.key
    }}));
    clearInterval(wsTimer);
    wsTimer = setInterval(()=>{ try{ ws.send(JSON.stringify({topic:'phoenix', event:'heartbeat', payload:{}, ref:String(++ref)})); }catch(e){} }, 25000);
    setStatus('live');
  };
  ws.onmessage = ev => {
    let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
    if(m.event === 'postgres_changes'){
      const rec = m.payload && m.payload.data && m.payload.data.record;
      if(rec){ applyRow(rec); renderAll(); }
    }
  };
  ws.onclose = () => {
    clearInterval(wsTimer);
    if(!SY.on) return;
    setStatus('zapas'); startPolling();
    wsTry++; setTimeout(connectWS, Math.min(30000, 2000*wsTry));
  };
  ws.onerror = () => { try{ ws.close(); }catch(e){} };
}
function startPolling(){ clearInterval(pollTimer); pollTimer = setInterval(()=>{ if(!document.hidden) syncPull(); }, 6000); }
function stopSync(){
  SY.on=false; DB.set('sync',SY);
  clearInterval(pollTimer); clearInterval(wsTimer);
  try{ if(ws) ws.close(); }catch(e){}
  ws=null; setStatus('off');
}

  if(!SY.url || !SY.key || !SY.pair) return;
  SY.on = true; DB.set('sync', SY);
  setStatus('laczenie');
  await syncPull();
  await pushChanged();
  connectWS(); startPolling();
}

const TITLES = {plan:['Plan na dni','Zaznacz ptaszkami co jecie'],
                shop:['Lista zakupów','Posortowana wg alejek'],
                rec:['Przepiśnik','Wasze dania'],
                fridge:['Asystent lodówki','Co zjeść z tego, co macie'],
                weight:['Postępy','Waga i obwód pasa']};
function go(t){
  tab = t;
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on', s.id==='s-'+t));
  document.querySelectorAll('.nav-in button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  const [a,b] = TITLES[t];
  $('#hTitle').textContent = t==='plan' ? 'Plan na '+S.days+(S.days===1?' dzień':S.days<5?' dni':' dni') : a;
  $('#hSub').textContent = b;
  if(t==='plan') renderPlan();
  if(t==='shop') renderShop();
  if(t==='rec') renderRec();
  if(t==='fridge') renderFridge();
  if(t==='weight') renderWeight();
  window.scrollTo(0,0);
}
document.querySelectorAll('.nav-in button').forEach(b=>b.onclick = ()=>go(b.dataset.t));
$('#btnSet').onclick = openSettings;
$('#btnSync').onclick = openSync;
$('#btnMsg').onclick = openMsgs;
window.addEventListener('resize', ()=>{ if(tab==='weight'){ const r=weightRows(); if(r.length>=2) drawChart(r); } });

function renderAll(){ go(tab); }

/* przykładowy plan przy pierwszym uruchomieniu */
if(!Object.keys(PLAN).length){
  PLAN = {
    '0-sniadanie':{r:'r1',mul:1,on:true}, '0-obiad':{r:'r2',mul:2,on:true}, '0-kolacja':{r:'r8',mul:1,on:true},
    '1-sniadanie':{r:'r3',mul:1,on:true}, '1-obiad':{r:'r2',mul:1,on:false}, '1-kolacja':{r:'r5',mul:1,on:true},
    '2-sniadanie':{r:'r12',mul:1,on:true},'2-obiad':{r:'r9',mul:1,on:true}, '2-przekaska':{r:'r11',mul:1,on:true}
  };
  save();
}
/* praca offline — działa tylko przy otwarciu z adresu, nie z pliku */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

go('plan');
</script>
